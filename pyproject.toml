[project]
name = "llm-rec-lab"
version = "0.3.0"
description = "LLM 与推荐的循序渐进实践课（当前：L05 SFT 与 LoRA）：场景预定义、H20 多卡批量运行、脱敏结果与证据图"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "transformers>=4.51",
    "peft>=0.15",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "accelerate>=1.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
labkit = "labkit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
# 私有仓库讲义代码的逐字节拷贝（tools/export_lessonbench.py 同步），按讲义仓库的规则检查，这里不改
extend-exclude = ["projects/lessonbench/vendor"]

[tool.ruff.lint]
# l 作为 label/line 的循环变量在教学代码里很常见；改名会改变 projects/ 的代码哈希，让已有结果过期
ignore = ["E741"]
