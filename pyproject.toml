[project]
name = "llm-rec-lab"
version = "0.2.0"
description = "推荐模型 + LLM 微调的循序渐进实践课：场景预定义、多卡批量运行、脱敏结果"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "transformers>=4.51",
    "peft>=0.15",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "accelerate>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
labkit = "labkit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# l 作为 label/line 的循环变量在教学代码里很常见；改名会改变 projects/ 的代码哈希，让已有结果过期
ignore = ["E741"]
