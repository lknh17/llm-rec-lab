course: R1
title: 推荐训练全流程：从评分日志到可复现的 AUC
project: rec
entry: rec.experiment
prepare_first: true          # 同一份预处理数据先跑一个，其余再并行（ML-20M 预处理要几分钟）

profiles:
  mac-m4pro:
    note: Apple M4 Pro，CPU 训练（小 MLP 在 MPS 上反而慢）。课程原始数字的来源
    base: {}
    seeds: [0]
    assets: [ml-1m]
    slots: {gpus_per_job: 0, jobs_per_device: 1}
  h20x8:
    note: 8 × NVIDIA H20。ML-1M 场景每个跑 5 个种子，另加 ML-20M、KuaiRand、合成数据三个放大场景
    base: {device: cuda, max_minutes: 60}
    seeds: [0, 1, 2, 3, 4]
    assets: [ml-1m, ml-20m, kuairand-pure]
    slots: {gpus_per_job: 1, jobs_per_device: 4}

scenarios:
  - id: baseline
    role: baseline
    title: 基线：时间切分，ID + 画像 + 电影属性，Embedding16 + MLP(128,64)，2 轮
    params: {}
    seeds_by_profile: {mac-m4pro: [0, 1, 2]}
    expect:
      - "meta.checks.data.train_has_future == False"
      - "summary.valid.auc > 0.72"

  - id: emb32
    role: variant
    title: embedding 维度 16 → 32
    params: {embedding_dim: 32}
  - id: epochs4
    role: variant
    title: 训练 2 轮 → 4 轮
    params: {epochs: 4}
  - id: lr3e-3
    role: variant
    title: 学习率 1e-3 → 3e-3
    params: {lr: 0.003}
  - id: dropout02
    role: variant
    title: MLP dropout 0 → 0.2
    params: {dropout: 0.2}

  - id: fault_random_split
    role: fault
    title: 教学故障：随机切分，未来行为进入训练集
    params: {split: random}
    expect:
      - "meta.checks.data.train_has_future == True"
      - "summary.valid.auc > base.summary.valid.auc + 0.02"

  # ---------------- 放大场景（只在 H20 档位） ----------------
  - id: ml20m_baseline
    role: variant
    title: 放大：MovieLens-20M（2000 万条，无用户画像），同一套模型
    profiles: [h20x8]
    params: {dataset: ml-20m, feature_groups: [ids, item_attr]}
    seeds: [0, 1, 2]
    expect:
      - "meta.data.rows > 19000000"
      - "summary.valid.auc > 0.7"
  - id: ml20m_random_split
    role: fault
    title: 放大：ML-20M 上的随机切分故障是否同样虚高
    profiles: [h20x8]
    params: {dataset: ml-20m, feature_groups: [ids, item_attr], split: random}
    seeds: [0, 1, 2]
    expect: ["meta.checks.data.train_has_future == True"]
  - id: kuairand_baseline
    role: variant
    title: 换任务：KuaiRand 真实曝光日志，标签 = is_click（负样本是曝光未点击）
    profiles: [h20x8]
    params: {dataset: kuairand-pure}
    seeds: [0, 1, 2]
    expect: ["summary.valid.auc > 0.55"]
  - id: synth_baseline
    role: variant
    title: 合成数据：已知真实概率，模型 AUC 和理论上限差多少
    params: {dataset: synth}
    profile_params:
      h20x8: {synth_users: 200000, synth_items: 50000, synth_rows: 20000000}
    seeds: [0, 1, 2]
    expect:
      - "summary.valid.auc < meta.checks.data.oracle_auc_valid"
      - "summary.valid.auc > 0.6"
