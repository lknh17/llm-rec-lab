- id: diagnose
  file: 15-diagnose
  stage: fault
  title: 诊断：模型没变，召回为什么掉了
  body: '模型是同一个（训练缓存命中），只改了 beam search 的初始化。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - fault_beamdup
  compare_to: baseline
  question:
    text: 根因是什么？
    options:
    - trie 掩码错了
    - beam 初始分数全为 0，同一个前缀被扩展了 W 次，W 条 beam 完全相同
    - 模型坍缩到热门物品
    - 去重位让碰撞的物品无法区分
  clues:
  - beam 扫描：W = 1 / 10 / 20 时 Recall {{v:fault_beamdup:summary.beam.w1.recall10:.3f}} / {{v:fault_beamdup:summary.beam.w10.recall10:.3f}} / {{v:fault_beamdup:summary.beam.w20.recall10:.3f}}；基线 {{v:baseline:summary.beam.w1.recall10:.3f}} / {{v:baseline:summary.beam.w10.recall10:.3f}} / {{v:baseline:summary.beam.w20.recall10:.3f}}。
  - 每用户不重复物品数：故障 {{v:fault_beamdup:summary.test.unique_per_user:.1f}}，基线 {{v:baseline:summary.test.unique_per_user:.1f}}；非法元组 {{v:fault_beamdup:summary.test.invalid_frac:.1%}}。
  - 看追踪里同一个用户的 10 条 beam：token 元组和分数是否完全相同。
