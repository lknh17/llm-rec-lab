steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: 让模型直接写出物品 ID：解码要花多少、会写出不存在的 ID 吗、beam 写错会怎样？
  body: '生成式召回把召回从"向量检索"变成"文本生成"：模型读完用户历史，逐个 token 写出下一个物品的语义 ID。落地时绕不开三个问题：


    - **解码成本**：每个用户 4 步 decoder 前向、每步在 W × V 个候选里选；beam 宽度和延迟怎么取舍？

    - **合法性**：模型可能写出不存在的码组合；加 trie 约束要多少显存？

    - **正确性**：beam search 的实现细节（初始分数、去重）一旦写错，结果可能全是重复的，离线指标却看起来"只是低了一点"。


    每个场景都已在 H20 上跑好。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一个用户从历史到 Top-10。点击每个节点看代码。

    '
  nodes:
  - id: sid
    title: 语义 ID
    shape: 物品 → 3 位码 + 1 位去重 → 4 个 token
    detail: R03 基线的做法，量化种子固定。
    code:
      file: genrec/sid.py
      region: collide
  - id: enc
    title: encoder
    shape: 最近 200 个物品 × 4 个 token → 每个物品一个位置 [B, 200, d]
    detail: 每个物品的输入 = 4 个 token 的 embedding 之和 + 位置编码。
    code:
      file: genrec/model.py
      region: encdec
  - id: dec
    title: decoder
    shape: BOS → t1 → t2 → t3 → t4，每步 [B·W, V] 的 logits
    detail: cross-attend encoder 输出；W 条 beam 共享同一份 memory。
  - id: trie
    title: trie 掩码
    shape: 节点 [B, W] → 合法掩码 [B, W, V]
    detail: 稠密转移表，一次 gather。
    code:
      file: genrec/model.py
      region: trie
  - id: beam
    title: beam search
    shape: '[B, W·V] 取全局 top-W'
    detail: 初始只有第 0 条 beam 分数为 0。
    code:
      file: genrec/model.py
      region: beam
  - id: map
    title: 反查物品
    shape: token 元组 → 物品 → Top-10
    detail: 没有去重位时一个元组对应一桶物品，按热度排开。
    code:
      file: genrec/train.py
      region: evaluate
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪一个用户
  body: '基线运行的真实追踪：一个测试用户最近 5 部电影和它们的语义 ID token；encoder 输入的形状；根节点允许的 token 数；beam 10 解码出的 10 个 token 元组、分数和对应的电影；目标电影是否命中。另有"保存后重新加载，Top-10 是否一致"。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: genrec/model.py
    region: encdec
    title: ① encoder-decoder
    note: encoder 每个历史物品一个位置（不是每个 token 一个位置），序列短 4 倍；decoder 只有 4 个位置。选 encoder-decoder 而不是 decoder-only：历史只编码一次，W 条 beam 共享。
  - file: genrec/model.py
    region: beam
    title: ② beam search
    note: score[:, 1:] = −∞ 那一行是关键：只有第 0 条 beam 能扩展，第一步才会选出 W 个不同的 token。cand [B, W·V] 取 top-W，beam = idx // V，token = idx % V。
  - file: genrec/model.py
    region: trie
    title: ③ GPU trie
    note: next_node [节点数, V]，−1 = 这个前缀下不存在。合法掩码 = next_node[nodes] ≥ 0，状态转移 = next_node[nodes, tokens]。
  - file: genrec/train.py
    region: train
    title: ④ 训练
    note: 随机取用户和终点，历史 = seq[:end] 的最后 200 个，目标 = seq[end] 的 4 个 token；交叉熵在全词表上算。
  - file: genrec/cost.py
    region: cost
    title: ⑤ 成本基准
    note: 1000 万 × d 的 bf16 物品表，256 个用户一批打分取 top-10，和 beam 10 解码的每用户毫秒比。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答三个问题。

    '
  questions:
  - text: 3 层 + 去重位、beam 10，每个用户要做几次 decoder 前向（批量算，按步数计）、每步在多少个候选里选？
    options:
    - 1 次，约 200 个
    - 4 次，约 10 × 200 个
    - 40 次，约 200 个
    - 4 次，约 3706 个
  - text: beam 5 时，Recall@10 的上限受什么限制？
    options:
    - 不受限，和 beam 10 一样
    - 最多只有 5 个候选，Recall@10 实际是 Recall@5
    - 受 trie 限制
  - text: 1000 万个物品全量打分（bf16 物品表 + top-10）和 beam 10 解码相比，每用户耗时比大约是？
    options:
    - 不到 0.5：全量打分更快
    - 0.5 - 2：差不多
    - 2 以上：beam 解码更快
