# 由私有讲义生成（python -m lab publish），不要手改；改私有讲义后重新生成。
# 这里只有问题、选项、要看的证据，没有答案和解析：每步"实测"折叠块里的结果就是揭晓。
course: L07
profiles:
  h20x8: H20 · Qwen2.5-7B · SFT + 偏好阶段 · 每个场景 3 种子
metric:
  path: summary.synth_excl.condition_keep
  label: 排除型合成集 条件保留率
  pct: true
table:
- path: summary.dev.exact_all_ok
  label: dev 全对率
- path: summary.synth_excl.condition_keep
  label: 排除型 条件保留率
- path: summary.synth_valid.condition_keep
  label: 合成验证 条件保留率
- path: summary.pref.pairs.pair_yield
  label: 偏好对产出率
- path: summary.pref.result.zero_adv_frac
  label: GRPO 无信号组比例
- path: summary.pref.result.gen_share
  label: GRPO 生成耗时占比
figures:
  loss: []
noise_note: dev 差异小于 6.7 个点（两条样本）、排除型合成集差异小于 5 个点（三条样本）或小于种子间波动，都按“差不多”算。
stages:
- id: understand
  title: 理解任务
- id: estimate
  title: 先估算
- id: source
  title: DPO：偏好对从哪来
- id: mech
  title: DPO：参考模型与 β
- id: grpo
  title: GRPO：可验证奖励
- id: fault
  title: 诊断故障
- id: takeaway
  title: 带走
steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: SFT 之后还有错，偏好优化能不能修、代价多大、会不会修错方向？
  body: '内容理解打标做完 SFT 后，常见的下一步是"上 DPO / RL"。这一课用 7B 在同一个抽取任务上把这件事做一遍，回答四个问题：


    1. **偏好数据从哪来**：自己写规则构造坏例子，还是让模型采样、挑它真的会犯的错？

    2. **在哪里有信号**：SFT 已经做对的 prompt 上，偏好优化还能学到什么？

    3. **会不会跑偏**：参考模型和 β 怎么管住"为了拉开 chosen/rejected 而把别的能力弄坏"？

    4. **奖励写成什么样**：可验证奖励只覆盖了部分维度时，没覆盖的维度会怎样？


    每个场景都已在 H20 上跑好（3 个种子）。依次点选预测、揭晓、看证据。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '先做 SFT（和 L05 基线同配置），把 SFT 的 LoRA 合并进基础权重，再挂一个新 LoRA 做偏好阶段。**关掉新 LoRA 就是参考模型**，不需要第二份 7B 权重。点击每个环节看它的输入输出和对应代码。

    '
  nodes:
  - id: sft
    title: SFT
    shape: 4000 条 → LoRA r=16，2 轮
    detail: 与 L05 基线同一套代码和参数；保存 sft_adapter。
    code:
      file: adextract/train.py
      region: train_loop
  - id: merge
    title: 合并 + 新 LoRA
    shape: W ← W + (α/r)·BA；再挂 B=0 的新 LoRA
    detail: merge_and_unload 后 get_peft_model。新 LoRA 的 B=0：训练开始时策略 = 参考模型。
  - id: pairs
    title: 偏好对
    shape: (prompt, chosen, rejected) × 512
    detail: rule：标准答案 vs 删条件 / 塞无依据卖点；onpolicy：标准答案 vs SFT 采样 G 条里最差的一条（全对的 prompt 不产生偏好对）。
    code:
      file: adpref/pairs.py
      region: rule_pairs
  - id: logp
    title: 序列对数概率
    shape: '[N, L] 逐 token → 求和 [N]'
    detail: 只在回答位置算 lm_head；交叉熵取负就是 log p(真实 token)。
    code:
      file: adpref/optim.py
      region: token_logps
  - id: dpo
    title: DPO loss
    shape: −log σ(β·(Δc − Δr))
    detail: 参考模型对数概率训练前一次算好（关掉新 LoRA 前向一遍）。
    code:
      file: adpref/optim.py
      region: dpo
  - id: sample
    title: 在线采样
    shape: 8 prompt × G=4 → 32 条回答
    detail: 温度 1、关掉 top_k/top_p/重复惩罚：采样分布 = 模型分布。生成的 token 原样拿去算梯度。
    code:
      file: adpref/pairs.py
      region: sample
  - id: reward
    title: 可验证奖励
    shape: 回答 + 标准答案 → [0, 1]
    detail: field：品类、卖点 F1、优惠 F1、条件保留，无依据扣分；recall_only：只看召回。
    code:
      file: adpref/reward.py
      region: reward
  - id: grpo
    title: GRPO loss
    shape: A = (r − 组均值)/组标准差
    detail: −A·mean log π + β_KL·k3(π_ref‖π)；每批只更新一次，重要性比恒为 1。
    code:
      file: adpref/optim.py
      region: grpo
- id: code
  file: 03-code
  stage: understand
  title: 代码导读
  body: '偏好阶段的全部新代码在 `adpref/` 下（SFT、数据、评测复用 `adextract/`）。读的时候只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: adpref/pairs.py
    region: rule_pairs
    title: ① 规则构造的 rejected
    note: 有条件就删条件，没条件就塞一个原文没有的卖点：负例覆盖什么错误，由这几行决定。
  - file: adpref/pairs.py
    region: sample
    title: ② 在线采样
    note: num_return_sequences=G；生成的 token 截到第一个停止符，GRPO 直接对这串 token 求对数概率。
  - file: adpref/optim.py
    region: token_logps
    title: ③ 逐 token 对数概率
    note: '[N, L]；mask 只留回答位置。DPO 求和成序列对数概率，GRPO 按 token 用。'
  - file: adpref/optim.py
    region: dpo
    title: ④ DPO
    note: 参考值训练前算好；每步记录偏好准确率、隐式奖励差、chosen/rejected 相对参考模型的变化。
  - file: adpref/reward.py
    region: reward
    title: ⑤ 可验证奖励
    note: 两种口径的差别只在哪些维度进了奖励。
  - file: adpref/optim.py
    region: grpo
    title: ⑥ GRPO
    note: 组内归一化优势；组内奖励全相同时优势为 0（无信号组）；KL 用 k3 估计。
- id: estimate
  file: 04-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答三个问题。7B 的 bf16 权重约 15 GB，H20 每卡 96 GB。

    '
  questions:
  - text: DPO 需要一个冻结的参考模型 π_ref（这里就是 SFT 模型）。本课的实现要为它多占多少显存？
    options:
    - 再加一份 7B 权重，约 15 GB
    - 几乎不用：关掉新 LoRA 就是参考模型
    - 要放一份 fp32 副本，约 30 GB
  - text: 每个 DPO 训练步有 8 个偏好对。策略模型要做几条序列的前向 + 反向？
    options:
    - 8 条（只算 chosen）
    - 16 条（chosen 和 rejected 各 8 条）
    - 32 条（策略和参考模型各 16 条）
  - text: β 从 0.1 降到 0.01。要让 DPO loss 降到同样的水平，(log π − log π_ref) 的 chosen/rejected 差距大约要变成原来的几倍？
    options:
    - 不变
    - 约 3 倍
    - 约 10 倍
- id: p_rule
  file: 05-rule
  stage: source
  title: 规则偏好对，同分布 prompt
  body: '512 个新合成 prompt（和 SFT 训练集同一个生成器、同样的句式分布）。chosen = 标准答案；rejected = 在标准答案上删掉一个条件，或者塞一个原文没有的卖点。DPO，β = 0.1，1 轮。

    '
  scenarios:
  - dpo_rule
  compare_to: baseline
  question:
    text: 和只做 SFT 比，dev 全对率（3 种子均值）会怎样？
    options:
    - 差不多（±6.7 个点以内）
    - 明显更好（> +6.7 个点）
    - 明显更差（< −6.7 个点）
  columns:
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
    delta: true
  - path: summary.dev.condition_keep
    label: dev 条件保留率
    pct: true
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
  - path: summary.synth_valid.exact_all_ok
    label: 合成验证全对率
    pct: true
  - path: evidence.curves.dpo_reward_acc.last
    label: 偏好准确率（末步）
    fmt: .2f
  charts:
  - metrics
  - loss
  curve: dpo_reward_acc
  look: 偏好准确率曲线多快到顶？到顶之后模型还在学什么？
- id: p_onpolicy
  file: 06-onpolicy
  stage: source
  title: 在线采样偏好对，同分布 prompt
  body: '换一种负例：SFT 模型对每个 prompt 用温度 1 采样 4 条，rejected = 4 条里奖励最低、且不全对的一条；**4 条全对的 prompt 不产生偏好对**。prompt 还是 512 个同分布合成样本。

    '
  scenarios:
  - dpo_onpolicy
  compare_to: baseline
  also:
  - dpo_rule
  question:
    text: 512 个 prompt 里，大约多少比例能产出偏好对（至少有一条采样不全对）？
    options:
    - 不到 10%
    - 10% - 50%
    - 50% 以上
  columns:
  - path: summary.pref.pairs.pair_yield
    label: 偏好对产出率
    pct: true
  - path: summary.pref.pairs.sample_reward_mean
    label: 采样平均奖励
    fmt: .3f
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
    delta: true
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
  charts:
  - metrics
  look: 产出率和规则偏好对（512 个，100%）比差多少？采样的算力花在了哪里？
- id: p_excl
  file: 07-excl
  stage: source
  title: prompt 换到模型会错的地方
  body: '还是规则偏好对，但偏好阶段的 512 个 prompt 里**一半换成排除型条件**（"满 199 减 30，活动款除外"）。SFT 训练集里没有这种句式。这些 prompt 的 rejected 就是"把排除条件删掉"——正好是 SFT 模型在这类句式上犯的错。

    '
  scenarios:
  - dpo_rule_excl
  compare_to: baseline
  also:
  - dpo_rule
  question:
    text: 排除型合成集（60 条）的条件保留率，和只做 SFT 比会怎样？
    options:
    - 基本不变（±5 个点以内）
    - 提升 5 - 20 个点
    - 提升 20 个点以上
    - 下降超过 5 个点
  columns:
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
    delta: true
  - path: summary.synth_excl.exact_all_ok
    label: 排除型 全对率
    pct: true
  - path: summary.dev.by_tag.排除型条件.all_ok
    label: dev 排除型条件（3 条）
    pct: true
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
  - path: summary.synth_valid.exact_all_ok
    label: 合成验证全对率
    pct: true
  charts:
  - metrics
  blocks:
  - errors
  look: 目标集合涨了多少？dev 的排除型条件和合成验证集（看有没有弄坏）分别怎样？
- id: p_onpolicy_excl
  file: 08-onpolicy-excl
  stage: source
  title: 在线采样 + 排除型 prompt
  body: '在线采样偏好对，prompt 同样一半是排除型条件。这次 SFT 模型在一半 prompt 上真的会错，产出率会高很多；rejected 是它"自己的错"，不一定是"删条件"。

    '
  scenarios:
  - dpo_onpolicy_excl
  compare_to: dpo_rule_excl
  also:
  - baseline
  - dpo_onpolicy
  question:
    text: 和规则偏好对（同样的 prompt）比，排除型合成集的条件保留率会怎样？
    options:
    - 在线采样明显更好（> +5 个点）
    - 差不多（±5 个点以内）
    - 规则偏好对明显更好（在线采样 < −5 个点）
  columns:
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
    delta: true
  - path: summary.pref.pairs.pair_yield
    label: 偏好对产出率
    pct: true
  - path: summary.pref.pairs.pairs
    label: 偏好对数
    fmt: .0f
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
  - path: summary.synth_valid.exact_all_ok
    label: 合成验证全对率
    pct: true
  charts:
  - metrics
  look: 产出率比同分布 prompt 高了多少？偏好对数少一些时，效果和规则对比如何？
- id: p_logp
  file: 09-logp
  stage: mech
  title: chosen 的概率涨了吗
  body: 'DPO 的目标是"chosen 相对参考模型涨得比 rejected 多"。训练中每步记录了 chosen 和 rejected 的 log π − log π_ref（序列对数概率，回答所有 token 求和）。

    '
  scenarios:
  - dpo_rule_excl
  question:
    text: 训练结束时，chosen 的 log π − log π_ref 大约是？
    options:
    - 明显上升（> +1）
    - 基本不变（−1 到 +1）
    - 下降（< −1）
  columns:
  - path: evidence.curves.chosen_logp_delta.last
    label: chosen 的 Δlogπ（末步）
    fmt: +.2f
  - path: evidence.curves.rejected_logp_delta.last
    label: rejected 的 Δlogπ（末步）
    fmt: +.2f
  - path: evidence.curves.dpo_reward_acc.last
    label: 偏好准确率（末步）
    fmt: .2f
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
  charts:
  - loss
  curve:
  - chosen_logp_delta
  - rejected_logp_delta
  look: 两条曲线谁动得多？偏好准确率到 1 之后，两条曲线还在往哪走？
- id: p_beta
  file: 10-beta
  stage: mech
  title: β 从 0.1 降到 0.01
  body: '同样的偏好对（规则对、一半排除型 prompt），只把 β 从 0.1 降到 0.01。β 越小，loss 对"偏离参考模型多远"越不敏感，模型可以走得更远。

    '
  scenarios:
  - dpo_beta_001
  compare_to: dpo_rule_excl
  also:
  - baseline
  question:
    text: 和 β = 0.1 比，dev 全对率（3 种子均值）会怎样？
    options:
    - 差不多（±6.7 个点以内）
    - 明显更好（> +6.7 个点）
    - 明显更差（< −6.7 个点）
  columns:
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
    delta: true
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
  - path: summary.synth_valid.exact_all_ok
    label: 合成验证全对率
    pct: true
  - path: evidence.curves.rejected_logp_delta.last
    label: rejected 的 Δlogπ（末步）
    fmt: +.1f
  - path: evidence.curves.chosen_logp_delta.last
    label: chosen 的 Δlogπ（末步）
    fmt: +.1f
  charts:
  - metrics
  - loss
  curve: rejected_logp_delta
  look: β 小 10 倍，rejected 被压低了多少倍？目标集合和 dev 是各往哪边走的？
- id: p_grpo
  file: 11-grpo
  stage: grpo
  title: GRPO，同分布 prompt
  body: 'GRPO：每步 8 个 prompt，每个采样 G = 4 条，用字段奖励打分；优势 = (奖励 − 组均值) / 组标准差。prompt 是 512 个同分布合成样本（64 步）。

    '
  scenarios:
  - grpo
  compare_to: baseline
  question:
    text: 每组 4 条回答奖励完全相同（优势全为 0，没有学习信号）的组，平均占多少？
    options:
    - 不到 30%
    - 30% - 70%
    - 70% 以上
  columns:
  - path: summary.pref.result.zero_adv_frac
    label: 无信号组比例
    pct: true
  - path: evidence.curves.grpo_reward.last
    label: 采样奖励（末步）
    fmt: .3f
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
    delta: true
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
  charts:
  - metrics
  - loss
  curve: grpo_zero_adv_frac
  look: 无信号组比例随训练怎么变？奖励曲线还有多少上升空间？
- id: p_grpo_excl
  file: 12-grpo-excl
  stage: grpo
  title: GRPO，一半排除型 prompt
  body: '同样的 GRPO，prompt 里一半换成排除型条件。字段奖励里条件保留占 0.3：SFT 模型丢掉排除条件时，这条回答的奖励比保留条件的低。

    '
  scenarios:
  - grpo_excl
  compare_to: baseline
  also:
  - grpo
  - dpo_rule_excl
  question:
    text: 排除型合成集的条件保留率，和只做 SFT 比会怎样？
    options:
    - 基本不变（±5 个点以内）
    - 提升 5 - 20 个点
    - 提升 20 个点以上
    - 下降超过 5 个点
  columns:
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
    delta: true
  - path: summary.pref.result.zero_adv_frac
    label: 无信号组比例
    pct: true
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
  - path: summary.synth_valid.exact_all_ok
    label: 合成验证全对率
    pct: true
  charts:
  - metrics
  - loss
  curve: grpo_reward
  look: 无信号组比例和同分布 prompt 比少了多少？奖励曲线是在往上走吗？
- id: p_reward
  file: 13-reward
  stage: grpo
  title: 奖励只看召回
  body: '同样的 GRPO 和 prompt，只把奖励换成"只看召回"：卖点和优惠找全了就给分，**不看条件**，也不罚多写、不罚无依据。

    '
  scenarios:
  - grpo_recall_excl
  compare_to: grpo_excl
  also:
  - baseline
  question:
    text: 和字段奖励比，排除型合成集的条件保留率会怎样？
    options:
    - 差不多（±5 个点以内）
    - 明显更低（< −5 个点）
    - 明显更高（> +5 个点）
  columns:
  - path: summary.synth_excl.condition_keep
    label: 排除型 条件保留率
    pct: true
    delta: true
  - path: summary.dev.ungrounded_rate
    label: dev 无依据率
    pct: true
  - path: summary.pref.result.zero_adv_frac
    label: 无信号组比例
    pct: true
  - path: summary.dev.exact_all_ok
    label: dev 全对率
    pct: true
  charts:
  - metrics
  look: 条件保留率停在哪？和 SFT 比呢？无依据率有没有往上漂？
- id: p_cost
  file: 14-cost
  stage: grpo
  title: 时间花在哪
  body: 'GRPO 每步先生成 32 条回答（8 prompt × 4，最长 160 token，逐 token 解码），再对这 32 条做一次前向 + 反向（并行处理整条序列）。

    '
  scenarios:
  - grpo_excl
  also:
  - dpo_rule_excl
  question:
    text: 偏好阶段的时间里，生成占多少？
    options:
    - 不到 25%
    - 25% - 60%
    - 60% 以上
  columns:
  - path: summary.pref.result.gen_share
    label: 生成耗时占比
    pct: true
