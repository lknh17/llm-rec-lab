- id: p_compile
  file: 08-compile
  stage: impls
  title: torch.compile
  body: '不改代码，把 naive 交给 torch.compile。编译器（Inductor）会把逐元素操作融合起来，但 QKᵀ 和 AV 两个矩阵乘之间的 L × L 张量能不能消掉，要看它能不能识别出整个 attention 模式。

    '
  scenarios:
  - compiled
  compare_to: baseline
  question:
    text: L = 8192 逐点打分，torch.compile 的增量显存比 naive 少多少？
    options:
    - 少不到一半
    - 少一半到 90%
    - 少 90% 以上
  columns:
