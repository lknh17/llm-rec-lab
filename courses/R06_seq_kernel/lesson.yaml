steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: HSTU 的逐点 attention 用不了 SDPA，写 kernel 值不值、怎么验证写对了？
  body: 'R02 里 HSTU 的 attention 在 10K 序列上占了 97% 以上的计算，PyTorch 逐步实现又要物化 L × L。三条路：


    - **torch.compile**：不改代码，看编译器能不能把 L × L 融合掉；

    - **手写 Triton**：照着 FlashAttention 的结构写，逐点打分反而比 softmax 简单；

    - **用现成的**：HSTU 官方有 Triton kernel，但要知道它在自己的形状上快多少。


    写 kernel 的风险是"快了但错了"：因果 mask 的边界只在部分位置出错，平均误差可能看不出来。这一课把四种实现在 H20 上逐项量出来，并且每个结果都和 fp32 参照对拍。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一次 attention 调用在四种实现里各走什么路径。点击每个节点看代码。

    '
  nodes:
  - id: naive
    title: naive
    shape: QKᵀ [B, H, L, L] → mask → softmax / SiLU → @ V
    detail: 每一步一个 kernel，中间张量都写回 HBM。
    code:
      file: recops/attn.py
      region: naive
  - id: kernel
    title: Triton 融合
    shape: grid = (⌈L / BLOCK_M⌉, B·H)，每个 program 一块 Q
    detail: 循环读 K / V 块，打分、mask、激活、累加都在片上。
    code:
      file: recops/attn.py
      region: triton_kernel
  - id: mirror
    title: CPU 分块镜像
    shape: 和 kernel 同样的循环，PyTorch 写
    detail: 在没有 GPU 的地方验证分块算法和故障。
    code:
      file: recops/attn.py
      region: block_mirror
  - id: acct
    title: FLOPs 与字节
    shape: 2·B·H·L²·D FLOPs；融合 4·B·H·L·D 个元素
    detail: naive 还要加上 L × L 中间张量的读写。
    code:
      file: recops/attn.py
      region: accounting
  - id: roof
    title: roofline
    shape: AI = FLOPs / 字节 → min(峰值, AI × 带宽)
    detail: H20：148 TFLOPS、4.0 TB/s，拐点 37。
    code:
      file: recops/bench.py
      region: roofline
  - id: timer
    title: 计时
    shape: 热身 → L2 冲刷 → CUDA event → 中位数
    code:
      file: recops/bench.py
      region: timer
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪
  body: '运行的真实追踪：第一个组合的 Q 形状、grid、块大小，以及它的耗时、误差、TFLOPS、roofline 占比。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: recops/attn.py
    region: naive
    title: ① naive
    note: s [B, H, L, L] 先写出来，再 masked_fill / softmax（或加偏置、SiLU），再乘 V。L = 8192、B·H = 32 时一个 bf16 的 L × L 张量就是 4.3 GB。
  - file: recops/attn.py
    region: triton_kernel
    title: ② Triton kernel
    note: hi = min((pid_m+1)·BLOCK_M, L)：右侧整块不读。POINTWISE 分支：s·sigmoid(s)·(1/L) 直接累加；softmax 分支：维护 m_i、l_i，acc 按 alpha 重新缩放。DIAG_CAUSAL 控制对角块里的逐元素 mask。
  - file: recops/attn.py
    region: block_mirror
    title: ③ 分块镜像
    note: 同样的块循环、同样的 mask 逻辑，用 PyTorch 写。测试里它和 naive 对拍（含长度不是块倍数的情形），也复现故障。
  - file: recops/attn.py
    region: accounting
    title: ④ 计数
    note: 因果下 QKᵀ 和 AV 各约 B·H·L²·D/2 次乘加。融合实现读写 Q、K、V、O；naive 多出至少 4 次 L × L 的读写。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答三个问题。B = 4、H = 8、D = 64、bf16。

    '
  questions:
  - text: L = 8192 时，naive 实现的一个 [B, H, L, L] bf16 中间张量多大？
    options:
    - 约 0.4 GB
    - 约 4 GB
    - 约 40 GB
  - text: 融合实现、L = 8192、D = 64，算术强度大约多少 FLOP/B？
    options:
    - 约 10
    - 约 100
    - 约 1000 以上
  - text: 同一个手写 kernel，逐点打分和 softmax 打分比，谁更快？
    options:
    - 逐点更快：块之间不需要最大值、指数和与重新缩放
    - 差不多
    - softmax 更快：逐点要额外查相对位置偏置
