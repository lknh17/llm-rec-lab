- id: diagnose
  file: 14-diagnose
  stage: fault
  title: 诊断：哪里看到了未来
  body: '只删了块内的因果 mask。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - fault_diag
  compare_to: triton
  question:
    text: 根因是什么？
    options:
    - bf16 精度不够
    - 尾块越界读了垃圾数据
    - 对角块里 query 看到了同一块里更靠后的 key（未来）
    - online softmax 的缩放写错了
  clues:
  - 误差的量级：正确的 kernel {{v:triton:summary.check.max_rel_err:.4f}}（bf16 噪声），故障 {{v:fault_diag:summary.check.max_rel_err:.3f}}。
  - 是不是只在尾块出错：L = 2000（不是 64 的倍数）{{v:fault_diag:summary.attn.pointwise_L2000_D64.rel_err:.3f}}，L = 2048 {{v:fault_diag:summary.attn.pointwise_L2048_D64.rel_err:.3f}}。两种打分：逐点 {{v:fault_diag:summary.attn.pointwise_L512_D64.rel_err:.3f}}，softmax {{v:fault_diag:summary.attn.softmax_L512_D64.rel_err:.3f}}。
  - 第 m 个 query 块循环到哪一块为止？最后那一块里，第 i 行和第 j 列（j > i）是什么关系？
