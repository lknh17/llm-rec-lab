  stage: fault
  title: 同事改了 kernel
  body: '同事看到 kernel 里"既跳过了右侧整块，又在每块里做因果 mask"，觉得重复了，删掉了块内的因果 mask——"右边的块根本没读，哪来的未来？"。耗时略有下降。

    '
