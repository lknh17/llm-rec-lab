- id: p_dedup_exact
  file: 11-dedup-exact
  stage: dedup
  title: 只做精确去重
  body: '回到 16K BPE，改去重方式。基线是"精确去重 + MinHash 近似去重"；这个场景**只做精确去重**（去掉空白后逐字相同的才删）。注入的副本一半是逐字相同，一半删了 1-2 句、前后加了转载声明——后一半精确去重删不掉。

    '
  scenarios:
  - dedup_exact
  compare_to: baseline
  question:
    text: 只做精确去重时，验证集里有多少比例的文档，它的同源文档（原文或副本）进了训练集？
    options:
    - 不到 5%
    - 5% - 20%
    - 20% 以上
  columns:
  - path: summary.corpus.valid_leak_frac
    label: 验证集泄漏比例
    pct: true
    delta: true
  - path: summary.corpus.train_copy_bytes_frac
    label: 训练集副本占字节
    pct: true
  - path: summary.corpus.dedup_removed
    label: 去重删掉的文档数
    fmt: ','
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
  charts:
  - metrics
  look: 精确去重删掉了多少篇？和注入的副本数比呢？
- id: p_fault
  file: 12-fault
  stage: dedup
  title: 关掉去重，验证集变乐观了
  body: '同事为了省时间把去重整个关掉（MinHash 在 CPU 上要跑几十秒），重新训了一遍，只看验证集就下了结论。训练文本还是 100 MB，模型、分词器都不变。


    我们手里多一样东西：**干净留出集 test**（注入副本之前就拿走，各场景完全相同）。同一个模型上，"留出集 bpb − 验证集 bpb"衡量验证集有多乐观。基线模型上它是 {{v:baseline:summary.gap.test_minus_valid_bpb:+.3f}}——两批不同文档本身的难易差，不是泄漏（基线的验证集泄漏比例只有 {{v:baseline:summary.corpus.valid_leak_frac:.1%}}）。

    '
  scenarios:
  - fault_nodedup
  compare_to: baseline
  also:
  - dedup_exact
  question:
    text: 不去重的模型上，"留出集 − 验证集"的 bpb 差，比基线大多少？
    options:
    - 几乎不变（不到 0.01）
    - 大 0.01 - 0.05
    - 大 0.05 以上
  columns:
  - path: summary.gap.test_minus_valid_bpb
    label: 留出集 − 验证集
    fmt: +.3f
    delta: true
  - path: summary.valid.bpb
    label: 验证集 bpb
    fmt: .3f
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
  - path: summary.corpus.valid_leak_frac
    label: 验证集泄漏比例
    pct: true
  - path: summary.corpus.train_copy_bytes_frac
    label: 训练集副本占字节
    pct: true
  charts:
  - metrics
  - loss
  curve: valid_bpb
  look: 验证集和留出集，哪个变得多？
- id: diagnose
  file: 13-diagnose
  stage: dedup
  title: 诊断：验证集为什么更乐观
  body: '模型、分词器、超参、训练文本量都没变，只是去重关了；验证集比干净留出集更乐观了。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - baseline
  compare_to: fault_nodedup
  question:
    text: 验证集变得更乐观的主要原因是什么？
    options:
    - 重复数据相当于多训了几轮，模型在所有文本上都学得更好了
    - 转载副本分别落进训练集和验证集，验证集里有模型背过的文章
    - 不去重时验证集换了一批更容易的文档，是抽样差异
    - 转载声明这类模板句在验证集里很多，模型很容易预测
  clues:
  - 对比干净留出集：基线 验证集 {{v:baseline:summary.valid.bpb:.3f}} / 留出集 {{v:baseline:summary.test.bpb:.3f}}；不去重 验证集 {{v:fault_nodedup:summary.valid.bpb:.3f}} / 留出集 {{v:fault_nodedup:summary.test.bpb:.3f}}。两个集合是一起变的吗？
  - 看语料统计：验证集里同源文档进了训练集的比例，基线 {{v:baseline:summary.corpus.valid_leak_frac:.1%}}，不去重 {{v:fault_nodedup:summary.corpus.valid_leak_frac:.1%}}；不去重时训练集里副本占字节 {{v:fault_nodedup:summary.corpus.train_copy_bytes_frac:.1%}}。
  - 同一个模型内部拆开看：不去重时，验证集里同源文档在训练集有 8 篇以上的那部分 bpb {{v:fault_nodedup:summary.valid_leak_many.bpb:.3f}}，从没被转载过的原文 {{v:fault_nodedup:summary.valid_uniq.bpb:.3f}}。
