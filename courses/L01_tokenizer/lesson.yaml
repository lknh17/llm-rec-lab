- id: p_tok_ads
  file: 10-tok-ads
  stage: domain
  title: BPE 训练文本里混入广告
  body: '训练 BPE 的 20 MB 文本里，10% 换成模板生成的广告文案（和评估用的 60 条人工广告不重叠）。**语言模型的训练数据完全不变**，只改了词表：广告高频词（"满减""包邮""第二件半价"）有机会合并成整词。

    '
  scenarios:
  - tok_ads
  compare_to: baseline
  also:
  - qwen
  question:
    text: 60 条人工广告，平均每条 token 数和基线比会怎样？
    options:
    - 减少 15% 以上
    - 减少 5% - 15%
    - 变化不到 5%
  columns:
  - path: summary.compression.ads.tokens_per_doc
    label: 广告 每条 token 数
    fmt: .1f
    delta: true
  - path: summary.compression.valid.bytes_per_token
    label: 维基 每 token 字节数
    fmt: .2f
  - path: summary.ads.bpb
