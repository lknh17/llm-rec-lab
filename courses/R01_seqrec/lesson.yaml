# 由私有讲义生成（python -m lab publish），不要手改；改私有讲义后重新生成。
# 这里只有问题、选项、要看的证据，没有答案和解析：每步"实测"折叠块里的结果就是揭晓。
course: R01
profiles:
  h20x8: H20 · MovieLens-1M · leave-one-out · 对全部 3706 部电影排序 · 3 种子
metric:
  path: summary.test.recall10
  label: 测试 Recall@10（全量排序，越高越好）
table:
- path: summary.test.recall10
  label: Recall@10
- path: summary.test.ndcg10
  label: NDCG@10
- path: summary.test.sampled100.recall10
  label: 采样 100 Recall@10
- path: summary.test.by_hist.gt_L.recall10
  label: 历史 > L 的用户 Recall@10
- path: summary.diag.gap_mean
  label: 输入末尾到目标的距离
- path: summary.cost.infer_macs_per_user
  label: 每用户推理乘加
- path: summary.train.samples_per_s
  label: 训练 样本/秒
figures:
  loss: []
noise_note: Recall@10 在 6040 个用户上的抽样标准误约 0.005；均值差小于 0.01（模型对比小于 0.03）或小于种子间波动，都按“差不多”算。
stages:
- id: understand
  title: 理解任务
- id: estimate
  title: 先估算
- id: models
  title: 三种模型
- id: length
  title: 序列长度
- id: truncate
  title: 截断方向
- id: takeaway
  title: 带走
steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: 把行为序列加长到底值不值？不同序列模型差多少、贵多少？
  body: '生成式推荐和长序列建模的讨论里，常见的说法是"序列越长越好"。但落到具体系统里，要先回答：


    - **用哪种模型**：mean pooling 最便宜，DIN 是精排里最常见的 target attention，SASRec / HSTU 是生成式推荐的编码器。它们之间的差距有多大？

    - **长度的收益落在谁身上**：只有历史比 L 长的用户才可能受益；他们占多少？

    - **评估口径**：很多论文用"目标 + 100 个随机负例"评估，这个口径会不会把差距放大或抹平？


    这一课在 ML-1M 上把这三件事各量一遍。每个场景都已在 H20 上跑好（3 个种子）。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一个用户的评分序列从 CSV 走到 Recall@10。点击每个节点看代码。

    '
  nodes:
  - id: load
    title: 读序列
    shape: 100 万条评分 → 6040 条按时间排的序列
    detail: 复用 recbase 的 CSV 解析；同一秒的评分按电影编号排。
    code:
      file: recseq/data.py
      region: truncate
  - id: split
    title: leave-one-out
    shape: 训练 seq[:-2]；验证目标 seq[-2]；测试目标 seq[-1]
    detail: 评估输入是目标之前的全部历史，再截断到 L。
  - id: window
    title: 训练窗口
    shape: 随机终点 e → 截断到 L+1 → x [B, L]、y [B, L]，左补齐
    detail: x 和 y 错开一位：每个位置预测下一个物品。
    code:
      file: recseq/data.py
      region: windows
  - id: model
    title: 序列模型
    shape: '[B, L] → 每个位置的用户表示 [B, L, d] → 对全部物品打分 [B, L, V]'
    detail: mean / DIN / SASRec 三选一，输出层和物品 embedding 共享。
    code:
      file: recseq/models.py
      region: sasrec
  - id: loss
    title: 全量 softmax
    shape: '[B·L, V] 交叉熵，pad 位置不监督'
    detail: 物品只有 3706 个，全量算得起。
    code:
      file: recseq/train.py
      region: train
  - id: eval
    title: 全量排序 / 采样 100
    shape: 最后一个位置的 [V] 打分 → 目标的名次
    detail: 同时算全量 Recall@10 和"目标 + 100 个随机负例"的 Recall@10。
    code:
      file: recseq/train.py
      region: evaluate
  - id: cost
    title: 成本
    shape: 解析 FLOPs / 推理乘加 + 实测探针
    detail: 注意力占比 L / (L + 12d)；DIN 推理 ≈ 2·L·V·d。
    code:
      file: recseq/cost.py
      region: estimate
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪一个用户
  body: '基线运行的真实追踪：

    - 一个历史很长的测试用户：保留最近 50 个和保留最早 50 个时，输入末尾的 5 部电影分别是什么、离目标隔了几步；

    - 训练 batch：x、y 的形状、末尾几个值，padding 占比；

    - 成本探针：不同长度下一条序列前向 + 反向的毫秒数。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: recseq/data.py
    region: truncate
    title: ① 截断
    note: recent 取 seq[-L:]，earliest 取 seq[:L]。训练窗口和评估输入都经过这一个函数。
  - file: recseq/data.py
    region: windows
    title: ② 训练窗口
    note: 随机终点 e，取 truncate(seq[:e], L+1)，x = 窗口[:-1]、y = 窗口[1:]，左补齐：最近的行为总在最右边。
  - file: recseq/models.py
    region: din
    title: ③ DIN
    note: s1 = h W Eᵀ 是"历史 j 对候选 c"的注意力打分 [B, L, V]，s2 = h Eᵀ 是被加权的值。没有位置偏置时，位置 t 只看 j ≤ t 的 softmax 可以用前缀和一次算完。
  - file: recseq/models.py
    region: sasrec
    title: ④ SASRec
    note: 先把左补齐转成右补齐（padding 移到"未来"），这样 SDPA 只用 is_causal=True、不传 mask，就能走 flash 后端；算完再转回来。
  - file: recseq/train.py
    region: evaluate
    title: ⑤ 评估
    note: 名次 = 打分高于目标的物品数。采样评估的负例从用户没交互过的物品里抽，和模型无关，各场景相同。
  - file: recseq/cost.py
    region: estimate
    title: ⑥ 成本估算
    note: 每层每 token：SASRec 线性 12d²、注意力 L·d；DIN 推理对每个候选重新做一次注意力。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答四个问题。模型 d = 64、2 层；ML-1M 有 3706 部电影。

    '
  questions:
  - text: 验证目标是每个用户的倒数第 2 个行为。训练序列最多能用到哪？
    options:
    - seq[:-1]
    - seq[:-2]
    - 整个序列
    - 随机 80%
  - text: SASRec（d = 64）在 L = 200 时，注意力的 QKᵀ 和 AV 占每 token 前向计算量的多少？
    options:
    - 不到 10%
    - 10% - 30%
    - 30% - 60%
    - 60% 以上
  - text: 给全部 3706 部电影打分，L = 200 时，DIN 每个用户的推理计算量是 SASRec 的几倍？
    options:
    - 不到 1 倍
    - 1 - 3 倍
    - 3 - 10 倍
    - 10 倍以上
  - text: 一个全量 Recall@10 约 0.2 的模型，在"目标 + 100 个随机负例"里排，Recall@10 大约多少？
    options:
    - 不到 0.3
    - 0.3 - 0.5
    - 0.5 - 0.8
    - 0.8 以上
- id: p_mean
  file: 06-mean
  stage: models
  title: mean pooling
  body: '把最近 50 个行为的 embedding 求平均，过一个线性层，作为用户表示。不看顺序，也不看候选是什么。训练、评估和 SASRec 完全相同。

    '
  scenarios:
  - mean_l50
  compare_to: baseline
  question:
    text: mean pooling 和 SASRec 比，测试 Recall@10 怎样？
    options:
    - 低 0.03 以上
    - 差不多（±0.03）
    - 高 0.03 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.test.ndcg10
    label: NDCG@10
    fmt: .3f
  - path: summary.test.sampled100.recall10
    label: 采样 100 Recall@10
    fmt: .3f
    delta: true
  - path: summary.train.final_loss
    label: 训练末 loss
    fmt: .3f
  charts:
  - metrics
  - loss
  curve: valid_recall10
  look: 两个模型的全量 Recall 差几倍？采样 Recall 差几倍？
- id: p_din
  file: 07-din
  stage: models
  title: DIN
  body: 'DIN 对每个候选物品重新给历史加权：和候选相似的历史物品权重大。和 mean pooling 一样不看顺序，但"看候选"。每个位置都监督（和 SASRec 一样多的训练信号）。

    '
  scenarios:
  - din_l50
  compare_to: baseline
  also:
  - mean_l50
  question:
    text: DIN 和 SASRec 比，测试 Recall@10 怎样？
    options:
    - 低 0.03 以上
    - 差不多（±0.03）
    - 高 0.03 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.test.sampled100.recall10
    label: 采样 100 Recall@10
    fmt: .3f
  - path: summary.train.samples_per_s
    label: 训练 样本/秒
    fmt: ',.0f'
  - path: summary.cost.infer_macs_per_user
    label: 每用户推理乘加
    fmt: ','
  charts:
  - metrics
  - loss
  curve: valid_recall10
  look: 三个模型的训练曲线（valid_recall10）谁先到顶？
- id: p_len20
  file: 08-len20
  stage: length
  title: 只看最近 20 个
  body: 'SASRec 的输入从最近 50 个缩到最近 20 个。ML-1M 用户的中位历史长度约 96，L = 20 时几乎所有用户都被截断。

    '
  scenarios:
  - sasrec_l20
  compare_to: baseline
  question:
    text: L 从 50 降到 20，测试 Recall@10 怎样？
    options:
    - 降 0.01 以上
    - 差不多（±0.01）
    - 升 0.01 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.test.by_hist.gt_L.recall10
    label: 历史 > L 的用户
    fmt: .3f
  - path: summary.test.by_hist.le_L.recall10
    label: 历史 ≤ L 的用户
    fmt: .3f
  - path: summary.test.by_hist.gt_L.n
    label: 历史 > L 的人数
    fmt: ','
  charts:
  - metrics
  look: 两组用户（历史 ≤ L / > L）各自变了多少？
- id: p_len200
  file: 09-len200
  stage: length
  title: 加长到 200
  body: 'SASRec 的输入加长到最近 200 个。L = 200 已经覆盖了大约四分之三用户的完整历史。

    '
  scenarios:
  - sasrec_l200
  compare_to: baseline
  question:
    text: L 从 50 加到 200，测试 Recall@10 怎样？
    options:
    - 降 0.01 以上
    - 差不多（±0.01）
    - 升 0.01 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.test.by_hist.gt_L.n
    label: 历史 > L 的人数
    fmt: ','
  - path: summary.cost.flops.attn_share
    label: 注意力占比
    fmt: .1%
  - path: summary.train.samples_per_s
    label: 训练 样本/秒
    fmt: ',.0f'
  charts:
  - metrics
  look: 长度 × 4，训练吞吐掉了多少？
- id: p_pool_len
  file: 10-pool-len
  stage: length
  title: mean pooling 加长到 200
  body: '同样把 mean pooling 的输入从 50 加到 200。平均对每个历史行为一视同仁。另有一个 DIN L = 200 的对照。

    '
  scenarios:
  - mean_l200
  compare_to: mean_l50
  also:
  - din_l200
  question:
    text: mean pooling 的 L 从 50 加到 200，测试 Recall@10 怎样？
    options:
    - 降 0.01 以上
    - 差不多（±0.01）
    - 升 0.01 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.test.by_hist.gt_L.recall10
    label: 历史 > L 的用户
    fmt: .3f
  - path: summary.test.by_hist.le_L.recall10
    label: 历史 ≤ L 的用户
    fmt: .3f
  charts:
  - metrics
  look: 三种模型加长到 200 的方向一致吗？
- id: p_cost
  file: 11-cost
  stage: length
  title: 加长的代价
  body: '同一个 SASRec，L = 50 和 L = 200，每步都是 128 条序列。看训练吞吐（样本/秒）。

    '
  scenarios:
  - sasrec_l200
  compare_to: baseline
  question:
    text: L = 200 的训练样本/秒是 L = 50 的多少？
    options:
    - 80% 以上：几乎不变
    - 40% - 80%
    - 15% - 40%
    - 不到 15%
  columns:
  - path: summary.train.samples_per_s
    label: 训练 样本/秒
    fmt: ',.0f'
    delta: true
  - path: summary.train.tokens_per_s
    label: 训练 token/秒
    fmt: ',.0f'
  - path: summary.cost.flops.attn_share
    label: 注意力占比
    fmt: .1%
  charts:
  - throughput
  - memory
  look: token/秒是涨了还是跌了？
- id: p_fault
  file: 12-fault
  stage: truncate
  title: 同事改了截断
  body: '同事重构数据管道时把截断写成了 seq[:L]——"保留 L 个行为"，没注意保留的是最早的。训练、评估都经过这个函数。训练正常结束，loss 甚至比以前低。

    '
  scenarios:
  - fault_earliest
  compare_to: baseline
  question:
    text: 测试 Recall@10 会怎样？
    options:
    - 降不到 0.01
    - 降 0.01 - 0.05
    - 降 0.05 以上
  columns:
  - path: summary.test.recall10
    label: Recall@10
    fmt: .3f
    delta: true
  - path: summary.train.final_loss
    label: 训练末 loss
    fmt: .3f
  - path: summary.test.by_hist.gt_L.recall10
    label: 历史 > 50 的用户
    fmt: .3f
  - path: summary.test.by_hist.le_L.recall10
    label: 历史 ≤ 50 的用户
    fmt: .3f
  charts:
  - metrics
  - loss
  curve: valid_recall10
  look: 验证曲线和训练 loss 的走势一致吗？
- id: diagnose
  file: 13-diagnose
  stage: truncate
  title: 诊断：loss 更低，测试为什么大跌
  body: '配置只改了截断方向。训练 loss 比基线低，测试 Recall@10 掉了一大截。按需逐级点开线索，然后点选最主要的原因。

    '
  scenarios:
  - fault_earliest
  compare_to: baseline
  question:
    text: 最主要的原因是什么？
    options:
    - 保留了最早的 50 个，最近兴趣丢了，输入末尾和目标隔得很远
    - L = 50 太短，模型容量不够
    - 历史长的用户本来就更难预测
    - 过拟合，没有早停
  clues:
  - 按历史长度分组：历史 ≤ 50 的用户 Recall {{v:fault_earliest:summary.test.by_hist.le_L.recall10:.3f}}（基线 {{v:baseline:summary.test.by_hist.le_L.recall10:.3f}}）；历史 > 50 的用户 {{v:fault_earliest:summary.test.by_hist.gt_L.recall10:.3f}}（基线 {{v:baseline:summary.test.by_hist.gt_L.recall10:.3f}}）。
  - 输入最后一个行为到目标隔了几步：{{v:fault_earliest:summary.diag.gap_mean:.0f}}（基线 {{v:baseline:summary.diag.gap_mean:.0f}}）。目标类型和输入末尾 5 部电影类型的重合度：{{v:fault_earliest:summary.diag.recent_genre_overlap:.3f}}（基线 {{v:baseline:summary.diag.recent_genre_overlap:.3f}}）。
  - 看追踪里同一个长历史用户：保留最近 50 个时输入末尾是哪几部、保留最早 50 个时是哪几部，各离目标隔了几步。
  columns:
  - path: summary.test.by_hist.le_L.recall10
    label: 历史 ≤ 50
    fmt: .3f
  - path: summary.test.by_hist.gt_L.recall10
    label: 历史 > 50
    fmt: .3f
  - path: summary.diag.gap_mean
    label: 输入末尾到目标的距离
    fmt: .1f
  - path: summary.diag.recent_genre_overlap
    label: 类型重合度
    fmt: .3f
  charts:
  - metrics
- id: keycard
  file: 14-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - leave-one-out 时训练序列最多用到哪？为什么？
  - 全量排序和采样 100 负例的 Recall 差多少？为什么采样指标会压缩模型差距？
  - mean pooling、DIN、SASRec 各看了什么、没看什么？
  - 序列加长的收益落在哪类用户？为什么 mean pooling 加长可能变差？
  - DIN 和 SASRec 的推理成本各随什么增长？各适合召回还是精排？
  - 截断方向错了，训练 loss 为什么反而更低？用什么检查能一眼发现？
  body: 按场景汇总全部实测（每个场景对应的步骤里有详细的表和图）。网页版这里是 AI 预写的只读要点卡，GitHub 版只给自查清单。
