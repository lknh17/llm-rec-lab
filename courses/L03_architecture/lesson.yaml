- id: diagnose
  file: 14-diagnose
  stage: moe
  title: 诊断：去掉负载均衡的代价在哪
  body: '去掉负载均衡损失后，离线 bpb 差不多，但专家负载严重不均。计划上线时用 8 卡专家并行（每卡放 1 个专家）。按需逐级点开线索，然后点选最主要的问题。

    '
  scenarios:
  - moe
  compare_to: fault_moe_noaux
  question:
    text: 去掉负载均衡损失，最主要的问题是什么？
    options:
    - 没有问题：bpb 差不多，均衡损失确实多余
    - 路由强者愈强，少数专家吃掉大部分 token：专家并行时最忙的卡决定整层耗时，其余卡空等；容量上限下还会丢 token
    - top-k 权重没有重新归一化，输出尺度不对
    - 专家太多、数据太少，每个专家都欠训练
  clues:
  - 离线质量：留出集 bpb 有均衡 {{v:moe:summary.test.bpb:.3f}}，去掉 {{v:fault_moe_noaux:summary.test.bpb:.3f}}，Dense 基线 {{v:baseline:summary.test.bpb:.3f}}。
  - 负载：最忙的专家分到的 token 是平均的几倍——有均衡 {{v:moe:summary.moe.load_max_over_mean:.2f}}，去掉 {{v:fault_moe_noaux:summary.moe.load_max_over_mean:.2f}}；各专家的负载比例（层平均）：{{v:fault_moe_noaux:summary.moe.load_frac}}。看 moe_max_load 曲线。
  - 路由熵（1 = 均匀，0 = 总选同一个）：有均衡 {{v:moe:summary.moe.router_entropy_norm:.3f}}，去掉 {{v:fault_moe_noaux:summary.moe.router_entropy_norm:.3f}}。专家并行时每层耗时由最忙的那张卡决定。
  columns:
  - path: summary.moe.load_max_over_mean
    label: 负载 最大/平均
    fmt: .2f
  - path: summary.moe.router_entropy_norm
    label: 路由熵（归一化）
    fmt: .3f
  - path: summary.moe.dead_experts
    label: 几乎不用的专家
    fmt: d
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
  charts:
  - metrics
- id: keycard
  file: 15-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - GQA、MQA、MLA 省的是什么？每 token KV cache 怎么算？Qwen2.5-7B 是多少？
  - MLA 为什么要把 RoPE 解耦出来？同字节下它比 MQA 强在哪？
  - 没有位置编码的因果模型怎么知道位置？RoPE 外推的问题是什么？
  - Pre-Norm 和 Post-Norm 差在哪一行？为什么深层时 Pre-Norm 更稳？
  - MoE 的总参数、激活参数、每 token FLOPs 各怎么算？
  - 去掉负载均衡，为什么离线指标看不出来？代价落在哪？
  - 哪些结论是确定量可以外推，哪些质量差不能外推？
  body: 按场景汇总全部实测（每个场景对应的步骤里有详细的表和图）。网页版这里是 AI 预写的只读要点卡，GitHub 版只给自查清单。
