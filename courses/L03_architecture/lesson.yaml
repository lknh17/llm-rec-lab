- id: p_mla
  file: 08-mla
  stage: attention
  title: 同样的 KV 字节，MLA 对 MQA
  body: 'MLA 每层每 token 缓存 96 维潜向量 + 32 维共享 RoPE key = 128 个元素，和 MQA（2 × 64）**完全相同**。区别在于 MLA 的每个头仍有自己的 k、v（由潜向量展开），而 MQA 所有头用同一组。

    '
  scenarios:
  - mla
  compare_to: mqa
  also:
  - baseline
  question:
    text: 同样的 KV cache 字节，MLA 和 MQA 比，留出集 bpb 怎样？
    options:
    - MLA 更好（低 0.02 以上）
    - 差不多（±0.02）
    - MLA 更差（高 0.02 以上）
  columns:
  - path: summary.test.bpb
    label: 留出集 bpb
