steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: GQA、MLA、RoPE、Pre-Norm、MoE 各省的是训练算力、参数还是推理带宽？代价是什么？
  body: '内容理解模型选基座时，常见的对比是"Qwen2.5-7B（GQA）还是 DeepSeek 系（MLA + MoE）"。技术报告里每个结构都号称"更好"，但它们的收益落在完全不同的地方：


    - **GQA / MQA / MLA** 不省训练算力，省的是**推理 KV cache**：打标服务长输入、高并发，KV cache 决定一张卡能同时跑多少请求；

    - **RoPE、Pre-Norm** 不省任何东西，决定的是**质量和训练稳定性**；

    - **MoE** 每 token 算力不变，用更多**参数**换质量，代价是显存、通信和负载均衡。


    这一课每个场景只换一处结构，确定量（KV 字节、参数、FLOPs）和质量（bpb）分开看。每个场景都已在 H20 上跑好（3 个种子）。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '训练循环和 L02 完全一样，只是 Block 里的几个部件可以替换。点击每个部件看代码。

    '
  nodes:
  - id: emb
    title: embedding
    shape: '[B, T] → [B, T, C]'
    detail: 和输出层共享。learned 位置编码时还要加一张 [T, C] 的位置表。
    code:
      file: tinylm/model.py
      region: gpt
  - id: attn
    title: 注意力变体
    shape: q [B, H, T, D]；k、v [B, Hkv, T, D]
    detail: MHA：Hkv = H；GQA：H 个查询头分成 Hkv 组；MQA：Hkv = 1。
    code:
      file: tinylm/model.py
      region: attention
  - id: mla
    title: MLA
    shape: x → c [B, T, R] + k_rope [B, T, Dr] → 各头 k、v
    detail: 缓存 c 和 k_rope；RoPE 只加在解耦出来的 Dr 维上。
    code:
      file: tinylm/model.py
      region: mla
  - id: norm
    title: Norm 与残差
    shape: Pre：x + f(norm(x))；Post：norm(x + f(x))
    detail: Pre-Norm 的残差流不经过 norm，梯度有一条恒等路径。
    code:
      file: tinylm/model.py
      region: norm
  - id: ffn
    title: FFN 或 MoE
    shape: '[N, C] → 路由 [N, E] → top-k → 专家 → 加权和'
    detail: MoE 每个专家是中间维 512 的 SwiGLU，top-2 时激活参数和 1024 的 Dense 相同。
    code:
      file: tinylm/model.py
      region: moe
  - id: kv
    title: KV cache 统计
    shape: 每层每 token 缓存的元素数 × 层数 × 2 字节
    detail: 不训练也能算：只取决于结构。
    code:
      file: tinylm/model.py
      region: kvcache
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪一层注意力
  body: '各变体的真实运行：一层注意力里 q、k、v 的形状、每 token 每层缓存几个元素；MoE 场景里验证集前 16 个 token 在第 1 层选中了哪两个专家。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: tinylm/model.py
    region: attention
    title: ① MHA / GQA / MQA
    note: qkv 投影的输出是 C + 2 × Hkv × D：查询头 H 个，KV 头 Hkv 个。SDPA 的 enable_gqa 让每 H / Hkv 个查询头共用一组 k、v，不必复制。
  - file: tinylm/model.py
    region: mla
    title: ② MLA
    note: kv_down 把 x 压成 R + Dr 维（这就是缓存的全部）；kv_up 再展开成每个头的 k_nope、v。q 的每个头也分成 D 维内容 + Dr 维位置，和 [k_nope, k_rope] 拼起来算内积。
  - file: tinylm/model.py
    region: norm
    title: ③ Pre-Norm 与 Post-Norm
    note: 只差一行：norm 包住 f 的输入，还是包住残差相加之后的结果。
  - file: tinylm/model.py
    region: moe
    title: ④ MoE 路由与负载均衡
    note: probs [N, E] → topk [N, K] → 重新归一化 → 逐专家 gather / scatter。aux = E × Σ f_e × P_e：f 不可导（计数），梯度通过 P 推着路由把概率分给冷门专家。
  - file: tinylm/model.py
    region: kvcache
    title: ⑤ KV cache 字节数
    note: MHA / GQA：2 × Hkv × D；MLA：R + Dr。乘层数、乘 2 字节（bf16）。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答四个问题。基线：6 层、6 头、D = 64、SwiGLU 中间维 1024，总参数约 1690 万（含 630 万 embedding）。

    '
  questions:
  - text: Qwen2.5-7B（28 层、28 个查询头、4 个 KV 头、D = 128、bf16），每个 token 的 KV cache 是多少？
    options:
    - 约 14 KB
    - 约 56 KB
    - 约 400 KB
    - 约 1.6 MB
  - text: 本模型（6 个查询头）换成 MQA（1 个 KV 头），每 token 的 KV cache 是 MHA 的多少？
    options:
    - 不到 20%
    - 20% - 40%
    - 40% 以上
  - text: 换成 MoE（8 个专家，每个专家中间维 512，top-2），模型总参数是 Dense 基线的几倍？
    options:
    - 不到 1.5 倍
    - 1.5 - 2.5 倍
    - 2.5 - 4 倍
    - 4 倍以上
  - text: 同一个 MoE，每 token 的训练 FLOPs 是 Dense 基线的几倍？
    options:
    - 不到 1.1 倍：几乎不变
    - 1.1 - 2 倍
    - 2 倍以上
- id: p_gqa
  file: 06-gqa
  stage: attention
  title: GQA：6 个查询头共享 2 组 KV
  body: 'KV 头从 6 个降到 2 个，每 token 的 KV cache 少 2/3。k、v 投影的参数也跟着少了：每层注意力参数从约 59 万降到约 39 万。

    '
  scenarios:
  - gqa2
  compare_to: baseline
  question:
    text: 和 MHA 比，GQA（2 组）的留出集 bpb 怎样？
    options:
    - 更好（低 0.02 以上）
    - 差不多（±0.02）
    - 更差（高 0.02 以上）
