- id: p_moe_wide
  file: 12-moe-wide
  stage: moe
  title: MoE 对同总参数的宽 Dense
  body: '另一个对照：宽 Dense，中间维 4096，FFN 参数和 MoE 的 8 个专家加起来一样多，但每个 token 都要过全部参数，每 token 算力约 2.2 倍。它是 MoE 的"上限"：同样的参数全都用上。

    '
