- id: p_fault
  file: 13-fault
  stage: moe
  title: 去掉负载均衡损失
  body: '同事觉得负载均衡损失"和语言建模无关、会拖累质量"，把系数设成 0 重训了一遍。其余和 MoE 场景完全相同。

