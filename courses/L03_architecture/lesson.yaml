- id: p_nope
  file: 09-nope
  stage: position
  title: 去掉位置编码
  body: '不加任何位置编码（NoPE）。模型只能靠因果 mask 隐式知道位置：第 t 个位置能看到 t 个 token，注意力的分母随位置变化。另外在 2 倍训练长度（1024 token）的窗口上评估，看外推。

    '
  scenarios:
  - nope
  compare_to: baseline
  question:
    text: 去掉 RoPE，留出集 bpb 会差多少？
    options:
    - 差不到 0.02
    - 差 0.02 - 0.1
    - 差 0.1 以上
  columns:
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
    delta: true
  - path: summary.valid.bpb
    label: 验证 bpb（512）
    fmt: .3f
  - path: summary.valid_long.bpb
    label: 验证 bpb（1024 窗口）
    fmt: .3f
