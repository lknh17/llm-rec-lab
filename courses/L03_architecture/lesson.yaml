  - loss
  curve: valid_bpb
  look: 两条验证曲线在训练早期差得多，还是后期差得多？
- id: p_post
  file: 10-post
  stage: norm
  title: 12 层 Post-Norm
  body: '层数加到 12，对比两种 Norm 位置。Pre-Norm：x + f(norm(x))；Post-Norm（原始 Transformer、BERT）：norm(x + f(x))。学习率、warmup、梯度裁剪完全相同（lr 2e-3、warmup 2%、裁剪 1.0），没有为 Post-Norm 调参。

    '
  scenarios:
  - post12
  compare_to: pre12
  also:
  - baseline
  question:
    text: 12 层 Post-Norm 和 12 层 Pre-Norm 比，留出集 bpb 怎样？
    options:
    - 差不多（差 0.02 以内）
    - 明显更差（差 0.02 - 0.2）
    - 很差或发散（差 0.2 以上）
