- id: p_moe
  file: 11-moe
  stage: moe
  title: MoE：同样的激活算力
  body: 'FFN 换成 8 个专家（每个中间维 512）、每 token 选 top-2，负载均衡系数 0.01。每 token 的算力和 Dense 相同，总参数约 2.3 倍。

