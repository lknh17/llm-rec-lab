- id: p_fault
  file: 14-fault
  stage: fault
  title: 同事重构了数据代码
  body: '同事重构了切块的代码，说"顺手简化了一下索引"，模型、语料、超参都没动。重新训练后，他在群里说：效果大幅提升了。

    '
  scenarios:
  - fault_noshift
  compare_to: baseline
  question:
    text: 重构后，干净留出集 bpb 和基线比怎样？
    options:
    - 低 1 以上：好得不可能
    - 低 0.05 - 1：确实大幅提升
    - 差不多或更差
  columns:
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
    delta: true
  - path: summary.valid.bpb
    label: 验证集 bpb
    fmt: .3f
  - path: summary.train.loss_at_warmup_end
    label: warmup 结束时 loss
    fmt: .3f
  charts:
  - metrics
  - loss
  curve: valid_bpb
  look: loss 曲线是在什么时候降到底的？
- id: diagnose
  file: 15-diagnose
  stage: fault
  title: 诊断：为什么好得不可能
  body: '模型、语料、超参都没变，只动了切块的代码；loss 很快降到接近 0，留出集也一样低。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - baseline
  compare_to: fault_noshift
  question:
    text: loss 降到接近 0 的根因是什么？
    options:
    - 验证集和留出集混进了训练集（泄漏）
    - 目标没有右移，模型只要把当前位置的输入抄过去
    - 学习率太大，模型把训练集背下来了
    - 评估只算了一小部分容易的窗口
  clues:
  - 对比干净留出集：基线 {{v:baseline:summary.test.bpb:.3f}}，重构后 {{v:fault_noshift:summary.test.bpb:.3f}}；验证集泄漏比例 基线 {{v:baseline:summary.corpus.valid_leak_frac:.1%}}，重构后 {{v:fault_noshift:summary.corpus.valid_leak_frac:.1%}}。留出集从没进过训练，它也一样低说明什么？
  - 看 loss 降得多快：warmup 刚结束（总步数的 2%）时，基线 loss {{v:baseline:summary.train.loss_at_warmup_end:.3f}}，重构后 {{v:fault_noshift:summary.train.loss_at_warmup_end:.3f}}。
  - batch 自检：第一个 batch 里 y 和 x 逐位置相等的比例，基线 {{v:baseline:summary.train.batch_check.y_eq_x_frac:.1%}}，重构后 {{v:fault_noshift:summary.train.batch_check.y_eq_x_frac:.1%}}。去 trace 里看 x 和 y 的前 8 个 token。
  columns:
  - path: summary.test.bpb
    label: 留出集 bpb
    fmt: .3f
  - path: summary.train.loss_at_warmup_end
    label: warmup 结束时 loss
    fmt: .3f
  - path: summary.train.batch_check.y_eq_x_frac
    label: y 与 x 逐位相等比例
    pct: true
  - path: summary.corpus.valid_leak_frac
    label: 验证集泄漏比例
    pct: true
  charts:
  - metrics
  - loss
- id: keycard
  file: 16-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - 6ND 的 N 包括哪些参数？漏掉了什么？什么时候漏掉的那项会变大？
  - 给你模型大小、token 数、卡数和 MFU，怎么估训练天数？
  - 为什么比较 token 预算时不能用一次长训练的中间点？
  - 数据不够时重复几遍还划算？看哪个信号决定停？
  - 退火什么时候有收益、什么时候反而减速？WSD 调度解决什么问题？
  - 等算力下模型该大还是该小？推理成本怎么改变这个答案？
  - loss 好得不可能时，第一步查什么？
  body: 按场景汇总全部实测（每个场景对应的步骤里有详细的表和图）。网页版这里是 AI 预写的只读要点卡，GitHub 版只给自查清单。
