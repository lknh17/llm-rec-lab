steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: 发散、吞吐低、显存爆——哪些参数影响质量，哪些只影响显存和吞吐？
  body: '内容理解模型做 SFT 或继续预训练，常见的三类事故：


    1. **发散**：loss 曲线中途出现尖刺，然后变成 NaN；或者没有 NaN，但就是比上次差。是学习率、warmup，还是精度？

    2. **显存爆**：batch 放不下，改成梯度累积——结果会变吗？

    3. **吞吐低**：长输入的打标样本把序列拉到 2K、8K，注意力的算力占比涨了多少？短样本 packing 时要不要加 mask？


    这一课每个场景只改一个参数，质量（bpb）、显存、吞吐、稳定性（梯度范数、尖刺）分开看。每个场景都已在 H20 上跑好（3 个种子）。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一步训练的完整路径。每个环节对应这一课的一个参数，点击看代码。

    '
  nodes:
  - id: pack
    title: packing
    shape: 文档 + EOS 首尾相接 → [B, T + 1] 块
    detail: doc_mask 打开时按 EOS 分段：块对角因果 mask，位置从 0 重新计。
    code:
      file: tinylm/model.py
      region: docmask
  - id: accum
    title: 梯度累积
    shape: '[64, 512] → 4 × [16, 512]'
    detail: 每份 loss ÷ 4 再反向，梯度在参数上累加；4 份做完才更新一次。
    code:
      file: tinylm/train.py
      region: train
  - id: fwd
    title: 16 位前向
    shape: autocast bf16 / fp16
    detail: 矩阵乘用 16 位，归一化和 softmax 内部用 fp32；参数和优化器状态始终是 fp32。
  - id: loss
    title: 交叉熵
    shape: logits [B, T, V] → fp32 → 标量
    detail: 对 logits 的梯度 = (softmax − onehot) / (B × T)，绝大多数分量很小。
  - id: bwd
    title: 反向 + GradScaler
    shape: loss × scale → 反向 → 梯度 ÷ scale
    detail: 只有 fp16 需要：把小梯度抬进 fp16 的可表示范围。出现 inf 时跳过这一步并把 scale 减半。
  - id: clip
    title: 梯度裁剪
    shape: 全局范数 > 1 时整体缩放
    detail: 防止单步更新过大；梯度范数曲线是稳定性的第一信号。
  - id: sched
    title: 调度器
    shape: warmup 2% → 余弦到 10%
    detail: warmup_frac = 0 时第一步就用峰值学习率。
    code:
      file: tinylm/train.py
      region: schedule
  - id: opt
    title: AdamW
    shape: fp32 参数 + 两份 fp32 状态
    detail: 每个参数 16 字节：权重 4 + 梯度 4 + 一阶矩 4 + 二阶矩 4。
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪一步训练
  body: '基线的一次真实运行：第一个 batch 的输入和目标、一层注意力的张量形状、训练了多少步。打开文档 mask 的场景可以对照看同一行里有几篇文档。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: tinylm/train.py
    region: train
    title: ① 梯度累积与 GradScaler
    note: 外层每步取 batch_size 条，内层拆成 grad_accum 份；loss ÷ accum 再 backward。fp16 + scaler 时 backward 的是 scale × loss，更新前 unscale_、裁剪，scaler.step 遇到 inf 会跳过。
  - file: tinylm/train.py
    region: schedule
    title: ② warmup 与余弦
    note: warm = total × warmup_frac；warmup_frac = 0 时 warm 取 1，第一步就是峰值。
  - file: tinylm/model.py
    region: docmask
    title: ③ 文档 mask
    note: doc = EOS 的累计计数 [B, T]；mask = (doc_i == doc_j) & 因果 [B, 1, T, T]；pos = 到本文档开头的距离，喂给 RoPE。显式 mask 让 SDPA 走不了 flash kernel。
  - file: tinylm/model.py
    region: attention
    title: ④ 注意力
    note: mask 为 None 时用 is_causal（flash 路径），否则传 attn_mask（稠密 [T, T] mask）。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答四个问题。基线：总参数约 1690 万；batch 64 × 512 = 32768 token；词表 16384；bf16 autocast，交叉熵前把 logits 转成 fp32。

    '
  questions:
  - text: 基线训练时的峰值显存大约是多少？（提示：参数 + 梯度 + Adam 状态共 16 字节/参数；logits [64, 512, 16384] 有 bf16 和 fp32 两份，反向时还有同样大小的梯度）
    options:
    - 不到 3 GB
    - 3 - 15 GB
    - 15 - 50 GB
    - 50 GB 以上
  - text: 梯度累积 4 次（每次前向 16 条），峰值显存是基线的多少？
    options:
    - 不到 40%
    - 40% - 80%
    - 80% 以上：差不多
  - text: Qwen2.5-7B（76 亿参数）全参 AdamW 训练，只算参数 + 梯度 + 优化器状态（16 字节/参数），一张 96 GB 的 H20 放得下吗？
    options:
    - 放得下，还剩一半给激活
    - 刚好放得下
    - 放不下：要 ZeRO / FSDP 切分，或者只训 LoRA
  - text: 交叉熵对 logits 的梯度是 (p − y) / N，N = 32768 个 token、V = 16384 个词。大部分词的 p 小于 1e-4。fp16 的最小正规数约 6.1e-5、最小次正规数约 6e-8。这些梯度分量在 fp16 里会怎样？
    options:
    - 完整保留：fp16 精度够用
    - 绝大多数变成 0，或者只剩一两位有效数字
    - 上溢成 inf，这一步被跳过
