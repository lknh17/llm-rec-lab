- id: diagnose
  file: 14-diagnose
  stage: precision
  title: 诊断：fp16 为什么静默变差
  body: '只把 bf16 换成了 fp16，没有 NaN、没有报错，效果明显变差。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - baseline
  compare_to: fault_fp16
  question:
    text: fp16 训练静默变差的根因是什么？
    options:
    - fp16 的尾数只有 10 位，前向的 loss 算不准
    - 没有 loss scaling：交叉熵对 logits 的小梯度在 fp16 里下溢成 0，大部分词收不到梯度
    - 梯度上溢成 inf，这些步被跳过了
    - fp16 要配更小的学习率
  clues:
  - 看 loss 曲线和梯度范数：梯度范数中位数 bf16 {{v:baseline:summary.train.grad_norm_median:.4f}}，fp16 {{v:fault_fp16:summary.train.grad_norm_median:.4f}}。没有出现 NaN。
  - 统计 logits 梯度里恰好为 0 的比例：bf16 {{v:baseline:summary.precision.dlogits_zero_frac:.1%}}，fp16 {{v:fault_fp16:summary.precision.dlogits_zero_frac:.1%}}。交叉熵的梯度要除以 32768 个 token。
  - 加上 GradScaler 之后：bpb {{v:fp16_scaler:summary.test.bpb:.3f}}（bf16 {{v:baseline:summary.test.bpb:.3f}}），零梯度比例 {{v:fp16_scaler:summary.precision.dlogits_zero_frac:.1%}}，最终 scale {{v:fp16_scaler:summary.precision.scaler_scale_final}}。
