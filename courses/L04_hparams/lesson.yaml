- id: keycard
  file: 16-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - 哪些参数影响质量，哪些只影响显存和吞吐？
  - 学习率太大时，loss 曲线和梯度范数各是什么样？梯度裁剪为什么挡不住？
  - warmup 解决什么问题？代价是什么？
  - 梯度累积为什么数学等价？什么情况下不等价？
  - 序列变长，注意力占比、吞吐、显存各怎么变？比较不同序列长度的模型要注意什么？
  - SFT 的 packing 为什么必须加文档 mask？生产里怎么实现才没有开销？
  - fp16 和 bf16 的区别在哪一位？为什么 fp16 必须配 loss scaling？
  body: 按场景汇总全部实测（每个场景对应的步骤里有详细的表和图）。网页版这里是 AI 预写的只读要点卡，GitHub 版只给自查清单。
