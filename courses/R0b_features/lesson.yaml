- id: p_dcn
  file: 14-dcn
  stage: features
  title: 换成 DCN-v2
  body: '特征不变（全部 5 组），结构从 MLP 换成"MLP 并联 3 层 DCN-v2 cross"：显式建模特征之间的交叉。

    '
  scenarios:
  - dcn_all
  compare_to: f_all
  question:
    text: 换成 DCN-v2，验证 AUC 会怎样？
    options:
    - 涨 0.3 个点以上
    - 差不多（±0.3）
    - 跌 0.3 个点以上
  columns:
  - path: summary.valid.auc
    label: 验证 AUC
    fmt: .4f
    delta: true
  - path: summary.valid.gauc
    label: 验证 GAUC
    fmt: .4f
    delta: true
  - path: summary.params.total
    label: 总参数
    fmt: ','
  - path: summary.train.seconds
    label: 训练秒数
    fmt: .1f
  charts:
  - metrics
  - params
  look: 差值和"只换种子"的波动比呢？
- id: p_daily
  file: 15-daily
  stage: timing
  title: T+1 天级统计
  body: '统计特征改成 T+1 天级：只用样本**前一天及更早**的评分（天级离线任务的产出）。不含未来，线上也能拿到——只是晚了一天。其余和"全部特征"相同。

    '
  scenarios:
  - stats_daily
  compare_to: f_all
  question:
    text: 改成天级统计，"训练集没见过的用户"这一组 AUC 掉多少？
    options:
    - 掉不到 0.5 个点
    - 掉 0.5 - 2 个点
    - 掉 2 个点以上
  columns:
  - path: summary.groups.valid.u_unseen.auc
    label: 没见过的用户 AUC
    fmt: .4f
    delta: true
  - path: summary.groups.valid.u_seen.auc
    label: 见过的用户 AUC
    fmt: .4f
    delta: true
  - path: summary.valid.auc
    label: 验证 AUC
    fmt: .4f
    delta: true
  - path: summary.test.auc
    label: 留出 AUC
    fmt: .4f
    delta: true
  charts:
  - metrics
  look: 天级口径下，"全部特征"还比基线（只用 ID）好多少？
- id: p_fault
  file: 16-fault
  stage: leak
  title: 全量统计
  body: '同事写特征的方式：先用全量评分日志按用户、按电影聚合出次数和喜欢率，再 join 回每一行样本——一条 SQL 搞定，比按时间算快得多。和"全部特征"只差这一个参数。离线训练、验证都用这份特征。

    '
  scenarios:
  - fault_stats_full
  compare_to: f_all
  also:
  - baseline
  question:
    text: 全量统计的验证 AUC，比时点正确的"全部特征"高多少？
    options:
    - 高不到 1 个点
    - 高 1 - 3 个点
    - 高 3 个点以上
  columns:
  - path: summary.valid.auc
    label: 验证 AUC
    fmt: .4f
    delta: true
  - path: summary.valid_serving.auc
    label: 同一批行·线上口径
    fmt: .4f
    delta: true
  - path: summary.test.auc
    label: 留出 AUC
    fmt: .4f
    delta: true
  - path: summary.stats_check.user_rows_using_future_share
    label: 含未来的行占比
    fmt: .2f
  charts:
  - metrics
  look: 验证 AUC 和留出 AUC 的方向一致吗？
- id: diagnose
  file: 17-diagnose
  stage: leak
  title: 诊断：全量统计的分数从哪来
  body: '配置只差统计口径一个参数，验证 AUC 多涨了一两个点，所有分组都在涨。按需逐级点开线索，然后点选最主要的原因。

    '
  scenarios:
  - fault_stats_full
  compare_to: f_all
  question:
    text: 全量统计的验证 AUC 更高，最主要的原因是什么？
    options:
    - 统计量里含有本行的标签和未来的行为，线上拿不到（穿越）
    - 全量统计样本多，估计更准
    - 模型过拟合
    - 验证集换了一批更容易的样本
  clues:
  - 线上回放：固定留出集（线上口径特征）上，时点正确 {{v:f_all:summary.test.auc:.4f}}，全量统计 {{v:fault_stats_full:summary.test.auc:.4f}}。离线涨，线上回放持平还是下跌？
  - 口径体检：用户统计里数进了未来的行占比 {{v:fault_stats_full:summary.stats_check.user_rows_using_future_share:.2f}}（时点正确为 {{v:f_all:summary.stats_check.user_rows_using_future_share:.2f}}）。只用"用户喜欢率"排序的 AUC：同一批验证行，全量口径 {{v:fault_stats_full:summary.stats_check.single_auc.user_rate.valid:.4f}}，换线上口径 {{v:fault_stats_full:summary.stats_check.single_auc.user_rate.valid_serving:.4f}}。
  - 同一个模型、同一批验证行，只换特征口径：{{v:fault_stats_full:summary.valid.auc:.4f}} → {{v:fault_stats_full:summary.valid_serving.auc:.4f}}。样本之前没有任何历史的用户（u_new）：全量口径 {{v:fault_stats_full:summary.groups.valid.u_new.auc:.4f}}，时点正确 {{v:f_all:summary.groups.valid.u_new.auc:.4f}}。
  columns:
  - path: summary.valid.auc
    label: 验证 AUC
    fmt: .4f
  - path: summary.valid_serving.auc
    label: 线上口径（同一批行）
    fmt: .4f
  - path: summary.test.auc
    label: 留出 AUC
    fmt: .4f
  - path: summary.stats_check.user_rows_using_future_share
    label: 含未来的行占比
    fmt: .2f
  - path: summary.groups.valid.u_new.auc
    label: 此前 0 次评分的用户 AUC
    fmt: .4f
  charts:
  - metrics
