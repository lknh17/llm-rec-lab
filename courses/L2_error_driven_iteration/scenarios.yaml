course: L2
title: 围绕错误做一次迭代：针对性补数据、多种子与最终测试
project: adextract
entry: adextract.experiment

profiles:
  mac-m4pro:
    note: Apple M4 Pro（MPS），Qwen2.5-0.5B-Instruct，400 条合成训练样本
    base: {}
    seeds: [0]
    assets: [qwen2.5-0.5b]
    slots: {gpus_per_job: 0, jobs_per_device: 1}
  h20x8:
    note: 8 × NVIDIA H20，Qwen2.5-7B-Instruct（bf16），4000 条合成训练样本，每个场景 3 个种子
    base: {model: Qwen/Qwen2.5-7B-Instruct, train_size: 4000, device: cuda, max_minutes: 180}
    seeds: [0, 1, 2]
    assets: [qwen2.5-7b]
    slots: {gpus_per_job: 1, jobs_per_device: 1}

scenarios:
  - id: baseline
    role: baseline
    title: 基线（与 L1 基线同配置，批量运行时只跑一次）
    params: {}
    seeds_by_profile: {mac-m4pro: [0, 1, 2]}

  - id: exclusion
    role: variant
    title: 针对"排除型条件"补 15% 训练样本
    params: {exclusion_ratio: 0.15}
    seeds_by_profile: {mac-m4pro: [0, 1]}
  - id: exclusion30
    role: variant
    title: 排除型样本比例加到 30%
    params: {exclusion_ratio: 0.3}
  - id: epochs4
    role: variant
    title: 4 轮，每轮在 dev 上生成评估（看 loss 和任务指标是否同向）
    params: {epochs: 4, eval_each_epoch: true}

  - id: fault_plain_template
    role: fault
    title: 教学故障：推理时用纯文本拼接，和训练的聊天模板不一致
    params: {infer_template: plain}
    expect: ["summary.dev.format_ok < base.summary.dev.format_ok - 0.3"]

  - id: final_base
    role: final
    title: 最终测试：基线在保留测试集上
    params: {final_test: true}
  - id: final_exclusion
    role: final
    title: 最终测试：补排除型样本后在保留测试集上
    params: {exclusion_ratio: 0.15, final_test: true}
