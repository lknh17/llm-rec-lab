course: L1
title: L05 SFT 与 LoRA：广告元素抽取（assistant-only 监督、rank 与挂载层、截断故障）
project: adextract
entry: adextract.experiment

profiles:
  mac-m4pro:
    note: Apple M4 Pro（MPS），Qwen2.5-0.5B-Instruct，400 条合成训练样本。课程原始数字的来源
    base: {}
    seeds: [0]
    assets: [qwen2.5-0.5b]
    slots: {gpus_per_job: 0, jobs_per_device: 1}
  h20x8:
    note: 8 × NVIDIA H20，Qwen2.5-7B-Instruct（bf16），4000 条合成训练样本，每个场景 3 个种子
    base: {model: Qwen/Qwen2.5-7B-Instruct, train_size: 4000, device: cuda, max_minutes: 180}
    seeds: [0, 1, 2]
    assets: [qwen2.5-7b]
    slots: {gpus_per_job: 1, jobs_per_device: 1}
  mac-smoke:
    note: Mac 冒烟：0.5B、16 条训练样本、2 步，只验证流程能跑通（结果没有教学意义，不检查断言）
    base: {train_size: 16, epochs: 1, max_steps: 2, max_new_tokens: 64, max_minutes: 15}
    seeds: [0]
    skip_expect: true
    assets: [qwen2.5-0.5b]
    slots: {gpus_per_job: 0, jobs_per_device: 1}

scenarios:
  - id: base_model
    role: reference
    title: 不训练，直接评估基础模型（零样本）
    params: {train_mode: none}
    seeds: [0]
  - id: baseline
    role: baseline
    title: 基线：LoRA r=16 挂注意力 + MLP，assistant-only 监督，2 轮
    params: {}
    expect:
      - "meta.data.tokenized.zero_supervision_examples == 0"
      - "summary.dev.exact_all_ok > 0.3"

  - id: all_tokens
    role: variant
    title: 整段都算 loss（系统提示和用户文案也监督）
    params: {supervision: all_tokens}
  - id: lora_r4
    role: variant
    title: LoRA 秩 16 → 4（alpha 同比缩小，缩放系数不变）
    params: {lora_r: 4, lora_alpha: 8}

  # ---------- rank、挂载层、学习率（只在 H20 档和冒烟档跑；alpha/r 固定为 2）----------
  - id: lora_r8
    role: variant
    title: LoRA 秩 16 → 8（alpha 16，缩放系数不变）
    params: {lora_r: 8, lora_alpha: 16}
    profiles: [h20x8, mac-smoke]
    expect:
      - "meta.model.params.trainable * 2 == base.meta.model.params.trainable"
  - id: lora_r64
    role: variant
    title: LoRA 秩 16 → 64（alpha 128，缩放系数不变）
    params: {lora_r: 64, lora_alpha: 128}
    profiles: [h20x8, mac-smoke]
    expect:
      - "meta.model.params.trainable == base.meta.model.params.trainable * 4"
  - id: lora_qv
    role: variant
    title: LoRA 只挂 q_proj / v_proj（r=16）
    params: {lora_targets: qv}
    profiles: [h20x8, mac-smoke]
    expect:
      - "meta.model.params.trainable * 6 < base.meta.model.params.trainable"
  - id: lora_attn
    role: variant
    title: LoRA 挂注意力 q/k/v/o（不挂 MLP，r=16）
    params: {lora_targets: attn}
    profiles: [h20x8, mac-smoke]
    expect:
      - "meta.model.params.trainable * 3 < base.meta.model.params.trainable"
  - id: lr_5e-5
    role: variant
    title: 学习率 2e-4 → 5e-5
    params: {lr: 5.0e-5}
    profiles: [h20x8, mac-smoke]
  - id: lr_1e-3
    role: variant
    title: 学习率 2e-4 → 1e-3
    params: {lr: 1.0e-3}
    profiles: [h20x8, mac-smoke]

  - id: fault_truncation
    role: fault
    title: 教学故障：max_len=256 + 右截断，回答被整段截掉
    params: {max_len: 256, truncation: right}
    expect:
      - "meta.data.tokenized.supervised_tokens_total == 0"
      - "summary.train.lora_B_norm_after == 0"
  - id: fix_truncation
    role: fix
    title: 修复：max_len=512（保留右截断，确认已不再截到回答）
    params: {max_len: 512, truncation: right}
    expect:
      - "meta.data.tokenized.zero_supervision_examples == 0"
      - "summary.dev.exact_all_ok > 0.3"
