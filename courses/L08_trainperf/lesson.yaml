- id: diagnose
  file: 18-diagnose
  stage: fault
  title: 诊断：MFU 掉在哪
  body: '模型、并行方式都没变，只换了数据来源。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - fault_dataloader
  compare_to: baseline
  also:
  - fix_dataloader
  question:
    text: 根因是什么？
    options:
    - 梯度通信没有和计算重叠
    - 数据在训练主进程里同步做 CPU 预处理，GPU 空等
    - 显存碎片导致分配器反复整理
    - mbs 太小，矩阵乘吃不饱
  clues:
  - 步时分解：数据 {{v:fault_dataloader:summary.time.data_ms:.0f}} ms（基线 {{v:baseline:summary.time.data_ms:.1f}}），前向 {{v:fault_dataloader:summary.time.fwd_ms:.0f}}、反向 {{v:fault_dataloader:summary.time.bwd_ms:.0f}} ms（基线 {{v:baseline:summary.time.fwd_ms:.0f}}、{{v:baseline:summary.time.bwd_ms:.0f}}）。
  - profiler：每步 kernel 计算 {{v:fault_dataloader:summary.prof.compute_ms_per_step:.0f}} ms（基线 {{v:baseline:summary.prof.compute_ms_per_step:.0f}}），GPU 空闲占比 {{v:fault_dataloader:summary.prof.gpu_idle_frac:.0%}}（基线 {{v:baseline:summary.prof.gpu_idle_frac:.0%}}）。
  - 配置：num_workers = 0；每个 rank 每步要处理 mbs 条样本；机器 CPU 核数 {{v:baseline:summary.hw.cpu_count}}。
  columns:
  - path: summary.time.data_ms
    label: 数据 ms
    fmt: .0f
  - path: summary.time.bwd_ms
    label: 反向 ms
    fmt: .0f
  - path: summary.prof.gpu_idle_frac
    label: GPU 空闲
    fmt: .1%
  - path: summary.mfu.mfu
    label: MFU
    fmt: .1%
  charts:
  - metrics
- id: keycard
  file: 19-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - 全参 AdamW 的静态显存是多少字节/参数？两种口径怎么对上？
  - ZeRO-1/2/3（FSDP）各切什么？静态显存和通信量各是 DDP 的多少？
  - MFU 和 HFU 怎么算？为什么 MFU 要和同机单卡基线比，而不是和 100% 比？
  - 重计算的代价和收益各是多少？什么时候不该开？
