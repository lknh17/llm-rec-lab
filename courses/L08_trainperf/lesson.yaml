# 由私有讲义生成（python -m lab publish），不要手改；改私有讲义后重新生成。
# 这里只有问题、选项、要看的证据，没有答案和解析：每步"实测"折叠块里的结果就是揭晓。
course: L08
profiles:
  h20x8: H20 × 8 · 类 Qwen2.5-1.5B / 7B · seq 2048 · bf16 · 3 种子（部分 1 种子）
metric:
  path: summary.mfu.mfu
  label: MFU（按 H20 标称 148 TFLOPS，越高越好）
table:
- path: summary.mfu.mfu
  label: MFU
- path: summary.throughput.tokens_per_s_per_gpu
  label: 每卡 tokens/s
- path: summary.memory.peak_allocated_gb
  label: 峰值显存 GB
- path: summary.throughput.step_ms_median
  label: 步时 ms
- path: summary.time.data_frac
  label: 等数据占比
- path: summary.prof.gpu_idle_frac
  label: GPU 空闲占比
figures:
  loss: []
noise_note: 性能测量的种子只影响随机输入；吞吐差小于 5% 或小于种子间波动，都按“差不多”算。
stages:
- id: understand
  title: 理解任务
- id: estimate
  title: 先估算
- id: single
  title: 单卡
- id: parallel
  title: 8 卡并行
- id: efficiency
  title: 算得划不划算
- id: scale
  title: 回到 7B
- id: fault
  title: 故障
- id: takeaway
  title: 带走
steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: 7B 训练 MFU 只有 20%，时间到底花在哪？
  body: '训练慢的时候，常见的反应是"加卡"或"换框架"。但 MFU 20% 意味着 80% 的算力没变成模型计算，原因可能在：


    - **GPU 在等**：数据没准备好、每步一次 `.item()` 同步、梯度通信没被反向盖住；

    - **算得不划算**：fp32、batch 太小让矩阵乘吃不饱、attention 没走 flash、优化器逐参数循环；

    - **多算了**：重计算多做一遍前向。


    显存也一样：7B 全参放不下一张卡，是参数、梯度、优化器状态还是激活？这一课在 8 张 H20 上逐项量出来。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一步训练和测量方式。点击每个节点看代码。

    '
  nodes:
  - id: spawn
    title: 启动 8 个 rank
    shape: rank0 在 labkit worker 里，rank 1-7 用 spawn
    detail: NCCL，超时 3 分钟；结束时 gather 各 rank 统计。
    code:
      file: trainperf/train.py
      region: spawn
  - id: wrap
    title: 包装
    shape: none / DDP / FSDP2；重计算；compile
    detail: DDP 用 gradient_as_bucket_view 省一份梯度。
    code:
      file: trainperf/train.py
      region: wrap
  - id: data
    title: 取数据
    shape: '[mbs, T + 1] token'
    detail: 默认直接在 GPU 上生成；故障场景走 CPU 分词。
    code:
      file: trainperf/data.py
      region: gpu_random
  - id: step
    title: 前向 → 反向 → 优化器
    shape: logits [mbs, T, 151936]
    detail: 吞吐窗口不插同步；逐阶段窗口每段前后同步。
    code:
      file: trainperf/train.py
      region: step_timing
  - id: mem
    title: 显存快照
    shape: 建模后 / 首个反向后 / 首次 step 后 / 峰值
    detail: 差值就是参数、梯度、优化器状态、激活与其他。
    code:
      file: trainperf/measure.py
      region: breakdown
  - id: mfu
    title: MFU
    shape: 每卡 tokens/s × 每 token FLOPs ÷ 峰值
    code:
      file: trainperf/train.py
      region: mfu
  - id: prof
    title: profiler
    shape: CUDA kernel 区间求并集
    detail: GPU 忙闲、NCCL 时间、暴露的通信（NCCL 区间减去计算区间）。
    code:
      file: trainperf/measure.py
      region: prof
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪
  body: '基线 rank0 的真实追踪：逐阶段计时窗口前 3 步的数据 / 前向 / 反向 / 优化器毫秒数；显存快照序列和解析估算对照。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: trainperf/train.py
    region: spawn
    title: ① 多卡启动
    note: rank0 留在 labkit worker 进程里（持有 ctx、写 summary），其余 7 个 rank 用 spawn 起子进程，继承同一份代码快照。
  - file: trainperf/train.py
    region: wrap
    title: ② DDP / FSDP2
    note: FSDP2 先对每个层 fully_shard，再对整个模型；reshard_after_forward=True 是 FULL_SHARD（前向后立刻释放整份参数），False 近似 ZeRO-2。
  - file: trainperf/train.py
    region: step_timing
    title: ③ 逐阶段计时
    note: 只有 timed=True 时才在每段前后同步，否则同步本身就会拖慢训练；吞吐用不同步的那 15 步算。
  - file: trainperf/measure.py
    region: breakdown
    title: ④ 显存构成
    note: 估算：16 字节/参数 ÷（FSDP 时）N；实测：三个快照的差值，峰值减去它们是激活与其他。
  - file: trainperf/train.py
    region: mfu
    title: ⑤ MFU
    note: 每 token 训练 FLOPs = 6 × matmul 参数 + 6 × 层数 × T × d（因果 attention）；重计算时 HFU 再加一遍前向。
  - file: trainperf/data.py
    region: cpu_pipeline
    title: ⑥ CPU 数据管线
    note: 每条样本：规范化 → 贪心分词 → 400 轮在线 BPE 合并，全是 Python。num_workers=0 时在训练主进程里串行做。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答四个问题。1.5B = 15.4 亿参数；H20 bf16 标称 148 TFLOPS。

    '
  questions:
  - text: 1.5B 全参 AdamW（混合精度）单卡的静态显存（不含激活）大约多少？
    options:
    - 约 3 GB
    - 约 12 GB
    - 约 25 GB
    - 约 50 GB
  - text: FSDP FULL_SHARD 8 卡，每卡的静态显存大约多少？
    options:
    - 约 0.4 GB
    - 约 3 GB
    - 约 12 GB
    - 约 25 GB
  - text: 7B、8 × H20、每卡 650 tokens/s，MFU 大约多少？
    options:
    - 不到 10%
    - 15% - 25%
    - 30% - 40%
    - 50% 以上
  - text: 1.5B DDP 8 卡，每步梯度 all-reduce 的数据量约 6 GB（fp32）。按 NVLink 正常水平（NCCL busbw 约 350 GB/s）估，没被反向盖住的通信大约占步时的多少？
    options:
    - 不到 5%
    - 5% - 20%
    - 20% 以上
