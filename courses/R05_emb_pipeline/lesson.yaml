  stage: fault
  title: 同事改了特征处理
  body: '同事给特征处理加了一个新规则，顺手把整批 numpy 改成了"更好读"的逐样本、逐特征 Python 循环。结果在单元测试里完全一致。上线训练后，nvidia-smi 里 GPU 利用率时高时低。

    '
