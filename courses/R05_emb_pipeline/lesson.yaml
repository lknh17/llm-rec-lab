- id: p_workers0
  file: 12-workers0
  stage: pipeline
  title: 不开 worker
  body: 'DataLoader 的 num_workers 设成 0：主进程自己取数和处理，取数时 GPU 不工作（不能重叠）。特征处理仍然是向量化的。

    '
  scenarios:
