    fmt: .3f
  - path: summary.optim.adam.peak_delta_gb
    label: 稠密 增量峰值 GB
    fmt: .2f
  charts:
  - metrics
- id: p_e2e_dense
  file: 10-e2e-dense
  stage: optim
  title: 端到端换稠密 Adam
  body: '端到端 DLRM（28 张表，每张 100 万 × 64，共 7.2 GB）的表从 SparseAdam 换成稠密 Adam。

