- id: p_nopin
  file: 13-nopin
  stage: pipeline
  title: 不锁页、阻塞拷贝
  body: '关掉锁页内存和 non_blocking：每次拷贝先从可分页内存拷到临时锁页缓冲，再拷到 GPU，并且阻塞。一批约 2 MB。

    '
  scenarios:
  - e2e_nopin
  compare_to: baseline
  question:
    text: 拷到 GPU 这一阶段的耗时是基线的几倍？
    options:
