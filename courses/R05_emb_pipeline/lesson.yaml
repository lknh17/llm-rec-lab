- id: p_stages
  file: 11-stages
  stage: pipeline
  title: 一步的时间花在哪
  body: '基线端到端（向量化特征处理、2 个 worker、锁页内存、SparseAdam），按阶段计时：等数据、拷到 GPU、前向 + 反向、优化器。

    '
  scenarios:
  - baseline
  question:
    text: 哪个阶段占比最大？
    options:
    - 等数据
    - 拷到 GPU
    - 前向 + 反向
    - 优化器
