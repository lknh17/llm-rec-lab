steps:
- id: pain
  file: 01-pain
  stage: understand
  title: 场景与痛点
  question_short: 推荐训练慢，时间到底花在查表、优化器、还是等数据上？
  body: '推荐模型训练慢，最常见的误判是"GPU 算力不够"。实际上：


    - Embedding 查表几乎不做计算，速度取决于显存带宽和访问模式；

    - 稠密优化器在大表上每步读写整张表，可能比前向反向还慢；

    - CPU 特征处理跟不上时，GPU 利用率看起来"不低"（偶尔满载），但大部分时间在等。


    不分阶段计时，就只能猜。这一课在 H20 上把每一项量出来。

    '
- id: flow
  file: 02-flow
  stage: understand
  title: 流程结构
  body: '一步训练的四个阶段，和三组微基准。点击每个节点看代码。

    '
  nodes:
  - id: raw
    title: 原始样本
    shape: 13 数值 + 26 类别 + 2 × 50 多值
    detail: 类别是 40 位整数，按表行数取模。
    code:
      file: recops/embops.py
      region: feature_proc
  - id: loader
    title: DataLoader
    shape: 每个 __getitem__ 返回一整批 4096
    detail: worker 进程里做特征处理，锁页内存。
  - id: h2d
    title: 拷到 GPU
    shape: 约 2 MB / 批
    detail: 锁页内存 + non_blocking 时可以和计算重叠。
  - id: model
    title: DLRM
    shape: 28 个 [B, 64] embedding + 数值塔 → 两两内积 → MLP
    detail: 表用稀疏梯度。
    code:
      file: recops/embops.py
      region: dlrm
  - id: opt
    title: 优化器
    shape: MLP 用 Adam；表用 SparseAdam（或稠密 Adam）
    detail: 稀疏只更新本批碰到的行。
    code:
      file: recops/embops.py
      region: optim
  - id: bench
    title: 微基准
    shape: 查表 / 表规模 / 优化器
    detail: CUDA event 计时、L2 冲刷、取中位数。
    code:
      file: recops/bench.py
      region: timer
- id: trace
  file: 03-trace
  stage: understand
  title: 追踪
  body: '基线运行的真实追踪：查表一次读多少字节、耗时、有效带宽和本机拷贝带宽；3 条原始样本处理前后的样子和一批的形状。

    '
  blocks:
  - trace
- id: code
  file: 04-code
  stage: understand
  title: 代码导读
  body: '只看三点：解决什么问题、关键的是哪几行、张量形状。

    '
  code:
  - file: recops/bench.py
    region: timer
    title: ① 计时
    note: 热身 → 每次前冲刷 L2（写 2 × L2 大小的缓冲，不计时）→ CUDA event 包住被测函数 → 一轮只同步一次 → 取中位数和 p10 / p90。
  - file: recops/embops.py
    region: emb_bench
    title: ② 查表微基准
    note: 有效带宽 = 读的字节 ÷ 时间，读的字节 = 样本数 × bag × d × 元素字节。理论下限按 HBM 标称带宽算。
  - file: recops/embops.py
    region: optim
    title: ③ 稀疏 vs 稠密优化器
    note: sparse=True 时 backward 产生稀疏梯度（只含本批碰到的行），SparseAdam 只读写这些行；否则梯度是整张表大小的稠密张量。
  - file: recops/embops.py
    region: feature_proc
    title: ④ 特征处理
    note: 两种写法结果完全相同（测试里对拍），差别只在一个是整批 numpy、一个是 Python 三重循环。
  - file: recops/embops.py
    region: e2e
    title: ⑤ 端到端逐阶段计时
    note: 每个阶段前后都同步，拿到真实耗时（会略微降低吞吐）；吞吐窗口里不插同步。
- id: estimate
  file: 05-estimate
  stage: estimate
  title: 先估算
  body: '不看结果，先回答三个问题。H20 标称 HBM 带宽 4.0 TB/s。

    '
  questions:
  - text: EmbeddingBag 求和（每个 id 读 64 个 fp32、做 64 次加法），算术强度大约多少 FLOP/B？
    options:
    - 约 0.25
    - 约 4
    - 约 40
    - 约 400
  - text: 16384 个样本 × 每个 10 个 id × 64 维 fp32，按 4.0 TB/s 读完至少要多久？
    options:
    - 约 0.01 ms
    - 约 0.01 - 0.1 ms
    - 约 1 ms
    - 约 10 ms
  - text: 1 亿行 × 128 维 fp32 的表，加上稠密 Adam 的两份状态，要多少显存？
    options:
    - 约 15 GB
    - 约 50 GB
    - 约 150 GB
    - 约 500 GB
- id: p_bw
  file: 06-bw
  stage: lookup
  title: bag 长度与有效带宽
  body: '同一张 1000 万 × 64 fp32 的表，每个样本查 1 / 10 / 50 个 id（均匀随机）。查得越多，读的字节越多，GPU 的并行度也越高。

    '
  scenarios:
  - baseline
  question:
    text: bag 50 的有效带宽是 bag 1 的几倍？
    options:
    - 不到 1.5 倍
    - 1.5 - 5 倍
    - 5 倍以上
  columns:
  - path: summary.emb.bag1_uniform.eff_gbs
    label: bag 1 GB/s
    fmt: ',.0f'
  - path: summary.emb.bag10_uniform.eff_gbs
    label: bag 10 GB/s
    fmt: ',.0f'
  - path: summary.emb.bag50_uniform.eff_gbs
    label: bag 50 GB/s
    fmt: ',.0f'
  - path: summary.hw.ref_copy_gbs
    label: 顺序拷贝 GB/s
    fmt: ',.0f'
  charts:
  - metrics
  curve: emb_eff_gbs
- id: p_zipf
  file: 07-zipf
  stage: lookup
  title: Zipf 热点
  body: '同样 bag 10，id 换成 Zipf 分布（α = 1.05）：少数热门 id 反复出现，读过的行可能还在 L2 里（H20 的 L2 是 60 MB）。

    '
  scenarios:
  - baseline
  question:
    text: Zipf 分布下查表耗时是均匀分布的多少？
    options:
    - 不到 50%
    - 50% - 90%
    - 90% 以上
  columns:
  - path: summary.emb.bag10_uniform.median_ms
    label: 均匀 ms
    fmt: .4f
  - path: summary.emb.bag10_zipf.median_ms
    label: Zipf ms
    fmt: .4f
  - path: summary.emb.bag10_zipf.unique_frac
    label: Zipf 不重复 id
    fmt: .1%
  charts:
  - metrics
- id: p_grid
  file: 08-grid
  stage: lookup
  title: 表规模与精度
  body: '表从 100 万行到 1 亿行，维度 64 / 128，精度 fp32 / bf16。每个组合都测显存和 bag 10 的查表耗时。

    '
  scenarios:
  - grid
  question:
    text: 1 亿 × 128 × fp32 的表能放进 H20 吗？
    options:
    - 能，查表耗时和小表差不多
    - 能，但查表明显变慢
    - 放不下（OOM）
  columns:
  - path: summary.grid.r1e8_d128_fp32.table_gb
    label: 1 亿×128 fp32 GB
    fmt: .1f
  - path: summary.grid.r1e8_d128_fp32.median_ms
    label: 1 亿×128 fp32 ms
    fmt: .4f
  - path: summary.grid.r1e8_d128_bf16.median_ms
    label: 1 亿×128 bf16 ms
    fmt: .4f
  - path: summary.grid.r1e6_d128_fp32.median_ms
    label: 100 万×128 fp32 ms
    fmt: .4f
  charts:
  - metrics
- id: p_optim
  file: 09-optim
  stage: optim
  title: SparseAdam 对稠密 Adam
  body: '1000 万 × 64 fp32 的表（2.56 GB），一步 = 查表 → 求和 → 反向 → 优化器。一批 16384 × 10 个 id，碰到的行不到表的 2%。

    '
  scenarios:
  - baseline
  question:
    text: 稠密 Adam 每步耗时是 SparseAdam 的几倍？
    options:
    - 不到 2 倍
    - 2 - 10 倍
    - 10 倍以上
  columns:
