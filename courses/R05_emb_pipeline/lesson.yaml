- id: keycard
  file: 17-keycard
  stage: takeaway
  title: 回顾
  blocks:
  - overview
  selfcheck:
  - 查表的算术强度是多少？为什么它受带宽限制？
  - 有效带宽为什么到不了顺序拷贝的带宽？Zipf 热点为什么能加速？
  - 表的显存怎么算？训练时还要加什么？
  - 稠密 Adam 在大表上每步读写多少？SparseAdam 省在哪、代价是什么？
  - 端到端怎么分阶段计时？各阶段的占比说明了什么？
  - GPU 利用率时高时低，怎么确认是在等数据？加 worker 和向量化各是什么代价？
  body: 按场景汇总全部实测（每个场景对应的步骤里有详细的表和图）。网页版这里是 AI 预写的只读要点卡，GitHub 版只给自查清单。
