- id: diagnose
  file: 15-diagnose
  stage: fault
  title: 诊断：GPU 在等什么
  body: '模型和优化器都没变。按需逐级点开线索，然后点选根因。

    '
  scenarios:
  - fault_pyfeat
  compare_to: baseline
  question:
    text: 根因是什么？
    options:
    - PCIe 带宽不够
    - GPU 被别的进程占用
    - CPU 上逐样本的 Python 特征处理太慢，worker 跟不上，GPU 在等数据
    - Embedding 表太大
  clues:
  - 逐阶段耗时：等数据 {{v:fault_pyfeat:summary.e2e.stage_ms.wait_data:.1f}} ms（基线 {{v:baseline:summary.e2e.stage_ms.wait_data:.2f}}），前向反向 {{v:fault_pyfeat:summary.e2e.stage_ms.forward_backward:.1f}} ms（基线 {{v:baseline:summary.e2e.stage_ms.forward_backward:.1f}}）。
  - 只取数不训练：管线每秒 {{v:fault_pyfeat:summary.loader.samples_per_s:,.0f}} 个样本（基线 {{v:baseline:summary.loader.samples_per_s:,.0f}}）；处理一批 {{v:fault_pyfeat:summary.loader.proc_ms_per_batch:.0f}} ms（基线 {{v:baseline:summary.loader.proc_ms_per_batch:.1f}}）。
  - worker 数 {{v:fault_pyfeat:summary.e2e.workers}}：每批平均要多久才能产出？和 GPU 一步比呢？
  columns:
  - path: summary.e2e.stage_ms.wait_data
    label: 等数据 ms
    fmt: .1f
  - path: summary.e2e.stage_ms.forward_backward
    label: 前向反向 ms
    fmt: .1f
  - path: summary.loader.samples_per_s
    label: 管线 样本/秒
    fmt: ',.0f'
  - path: summary.loader.proc_ms_per_batch
    label: 处理一批 ms
    fmt: .1f
  charts:
  - metrics
  curve: stage_ms
